<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Public Live View — ACC Auction</title>
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/reset.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/typography.css" />
<link rel="stylesheet" href="../css/layout.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/auction.css" />
<link rel="stylesheet" href="../css/dashboard.css" />
<link rel="stylesheet" href="../css/animations.css" />
<link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <a href="../index.html" class="nav-brand"><div class="nav-logo">ACC</div><div><div class="nav-title">PUBLIC LIVE VIEW</div><div class="nav-subtitle">READ ONLY • NO LOGIN</div></div></a>
    <div class="nav-actions"><div class="live-chip live"><span class="live-dot"></span>LIVE</div><a href="projector.html" class="btn btn-ghost">PROJECTOR</a></div>
  </div>
</header>

<div class="auction-layout" style="min-height:calc(100dvh - 64px)">
  <div class="auction-header">
    <div style="display:flex;gap:12px;align-items:center"><span class="kicker kicker-auction"><span class="kicker-dot"></span>LIVE AUCTION</span><span class="label">ROUND 1 • B3 → B4 → B2 → B5 → B1 → PG</span></div>
    <div style="display:flex;gap:8px"><span class="connection-status connected">CONNECTED</span><span class="badge badge-auction" id="lot-counter">LOT 1 / 42</span></div>
  </div>
  <div class="auction-player" id="player-pane"></div>
  <div class="auction-center" id="center-pane"></div>
  <div class="auction-timer" id="timer-pane"></div>
  <div class="auction-strip" id="franchise-strip"></div>
</div>

<section class="section" style="background:var(--color-bg-elevated);border-top:1px solid var(--border-subtle)">
  <div class="container container-wide">
    <div class="dashboard-grid">
      <div class="col-8"><div class="card"><div class="card-header"><div class="card-title">Squads as they fill • Purse • Max Bid • Bucket</div><div class="filter-bar"><input id="squad-search" placeholder="Search team" class="field-input" style="height:36px;min-width:200px" /></div></div><div class="card-body" id="squads-grid"></div></div></div>
      <div class="col-4"><div class="card"><div class="card-header"><div class="card-title">Sold • Unsold • Allotted</div></div><div class="card-body" id="sold-list" style="display:flex;flex-direction:column;gap:8px;max-height:600px;overflow:auto"></div></div><div class="card" style="margin-top:16px"><div class="card-header"><div class="card-title">Scarcity Monitor</div></div><div class="card-body" id="scarcity-pane"></div></div></div>
    </div>
  </div>
</section>

<script type="module">
import { state, getPlayer, on } from '../js/state.js';
import { tickTimer, startAuction, hammerSale, placeBid, simulateBotBids } from '../js/auction.js';

function renderPlayer(){
  const lot = state.auction.currentLot;
  const pane = document.getElementById('player-pane');
  if(!lot){ pane.innerHTML='<div class="empty-state"><div class="empty-title">AUCTION HAS NOT STARTED</div></div>'; return; }
  pane.innerHTML=`
    <div class="player-hero">
      <div class="player-hero-img"><img src="${lot.photo}" alt="${lot.name}" /><div class="player-hero-overlay"></div></div>
      <div class="player-hero-content">
        <div class="player-hero-name">${lot.name}</div>
        <div class="player-hero-type">${lot.derivedType}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px"><span class="chip">${lot.program} ${lot.branch} Y${lot.year}</span><span class="chip">${lot.bucket||'PG'}</span><span class="chip">BASE ${lot.basePrice}</span><span class="chip">${lot.rollNumber}</span></div>
        <div class="player-stats" style="margin-top:12px">
          <div class="stat-mini"><div class="stat-mini-label">Matches</div><div class="stat-mini-value">${lot.stats.matches}</div></div>
          <div class="stat-mini"><div class="stat-mini-label">Runs</div><div class="stat-mini-value">${lot.stats.runs}</div></div>
          <div class="stat-mini"><div class="stat-mini-label">Wickets</div><div class="stat-mini-value">${lot.stats.wickets}</div></div>
        </div>
      </div>
    </div>`;
}
function renderCenter(){
  const lot = state.auction.currentLot;
  const pane = document.getElementById('center-pane');
  if(!lot){ pane.innerHTML=''; return; }
  const bidder = state.auction.currentBidder ? state.franchises.find(f=>f.id===state.auction.currentBidder) : null;
  pane.innerHTML=`
    <div class="price-display">
      <div class="price-label">Current Bid</div>
      <div class="price-value current-bid-value mono" id="bid-value" style="font-size:96px;color:${state.auction.currentBid? 'var(--color-auction)': 'var(--color-text-muted)'}">${state.auction.currentBid||lot.basePrice}</div>
      <div class="price-credits">CREDITS</div>
      <div style="margin-top:12px">${bidder? `<div class="bidder-chip">${bidder.name}</div>` : '<span class="badge">NO BIDS YET • OPENS AT '+lot.basePrice+'</span>'}</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px"><span class="badge">NEXT ${state.auction.currentBid? (state.auction.currentBid<100?state.auction.currentBid+10:state.auction.currentBid<200?state.auction.currentBid+20:state.auction.currentBid+30) : lot.basePrice}</span><span class="badge badge-success">${state.franchises.filter(f=>f.status==='ACTIVE').length} ACTIVE</span></div>
  `;
}
function renderTimer(){
  const pane=document.getElementById('timer-pane');
  const pct = (state.auction.timer/state.auction.timerMax)*100;
  const cls = state.auction.timer<=5 ? 'critical' : state.auction.timer<=10 ? 'warning' : '';
  pane.innerHTML=`
    <div class="timer-ring ${cls}" style="--progress:${pct}%"><div class="timer-inner"><div class="timer-value mono" id="timer-val">${state.auction.timer}</div><div class="timer-unit">SECONDS</div></div></div>
    <div class="label" style="margin-top:8px">${state.auction.firstBid ? 'FIRST BID • 30S' : 'RESET TO 20S ON BID'}</div>
  `;
}
function renderStrip(){
  const strip=document.getElementById('franchise-strip');
  strip.innerHTML='';
  state.franchises.forEach(f=>{
    const div=document.createElement('div');
    div.className=`franchise-card ${f.status.toLowerCase()}`;
    if(f.id===state.auction.currentBidder) div.classList.add('active');
    div.innerHTML=`<div class="franchise-logo">${f.short}</div><div><div class="franchise-name">${f.short}</div><div class="franchise-status"><span class="status-dot ${f.status==='ACTIVE'?'active':f.status==='BLOCKED'?'blocked':'passed'}"></span>${f.status}</div></div>`;
    strip.appendChild(div);
  });
}
function renderSquads(){
  const grid=document.getElementById('squads-grid');
  const filter=(document.getElementById('squad-search')?.value||'').toLowerCase();
  grid.innerHTML='';
  state.franchises.filter(f=>!filter||f.name.toLowerCase().includes(filter)||f.short.toLowerCase().includes(filter)).forEach(f=>{
    const squadCount=f.squad.length;
    const maxBid=f.maxBid;
    const card=document.createElement('div');
    card.className='metric-card';
    card.style.minWidth='260px';
    const bucketHtml=Object.entries(f.bucketCounts).map(([b,c])=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border-subtle)"><span>${b}</span><span class="mono" style="font-weight:700">${c}/2 ${c>=2?'✓':''}</span></div>`).join('');
    card.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;align-items:center;gap:8px"><div class="franchise-logo">${f.short}</div><div style="font-weight:800;font-size:13px;letter-spacing:0.04em">${f.name}</div></div><span class="badge ${f.purse<200?'badge-danger':''}">₹${f.purse}</span></div>
      <div style="display:flex;gap:8px;margin-top:4px"><span class="label">SQUAD ${squadCount}/15</span><span class="label">MAX ${maxBid}</span></div>
      <div style="margin-top:8px">${bucketHtml}</div>
      <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">${f.squad.slice(0,6).map(pid=>{const p=getPlayer(pid); return `<span class="chip" style="font-size:10px">${p?.name.split(' ')[0]||pid}</span>`}).join('')}${f.squad.length>6? `<span class="chip">+${f.squad.length-6}</span>`:''}</div>
    `;
    grid.appendChild(card);
  });
  grid.style.display='grid';
  grid.style.gridTemplateColumns='repeat(auto-fill,minmax(280px,1fr))';
  grid.style.gap='12px';
}
function renderSold(){
  const pane=document.getElementById('sold-list');
  pane.innerHTML='';
  [...state.auction.sold].reverse().slice(0,30).forEach(s=>{
    const p=getPlayer(s.playerId);
    const f=state.franchises.find(x=>x.id===s.franchiseId);
    const div=document.createElement('div');
    div.className='timeline-item';
    div.innerHTML=`<div class="timeline-time">${new Date(s.at).toLocaleTimeString()}</div><div class="timeline-desc"><strong>${p?.name}</strong> → ${f?.short} @ <strong>${s.price}</strong> ${s.status}</div>`;
    pane.appendChild(div);
  });
}
function renderScarcity(){
  const pane=document.getElementById('scarcity-pane');
  pane.innerHTML=Object.entries(state.auction.scarcity).map(([b,info])=>`
    <div class="bucket-card ${info.warning?'required':''}" style="margin-bottom:8px">
      <div class="bucket-top"><span class="bucket-name">${b}</span><span class="badge ${info.warning?'badge-warning':''}">${info.unsold} unsold / ${info.needed} needed</span></div>
      ${info.warning? `<div class="scarcity-banner"><div class="icon">⚠</div> SCARCITY • ${b} • ${info.unsold} ≤ ${info.needed}</div>`:''}
    </div>
  `).join('') || '<div class="muted" style="font-size:12px">No scarcity data</div>';
}

function fullRender(){
  renderPlayer(); renderCenter(); renderTimer(); renderStrip(); renderSquads(); renderSold(); renderScarcity();
  const counter=document.getElementById('lot-counter');
  if(counter) counter.textContent=`LOT ${state.auction.lotIndex+1} / ${state.auction.queue.length}`;
}

on('auction:lot', fullRender);
on('auction:bid', ()=>{ renderCenter(); renderStrip(); renderSquads(); document.getElementById('bid-value')?.classList.add('bump'); setTimeout(()=>document.getElementById('bid-value')?.classList.remove('bump'),240); });
on('auction:pass', renderStrip);
on('auction:timer', renderTimer);
on('auction:hammer', fullRender);
on('auction:undo', fullRender);
on('auction:state', fullRender);

fullRender();
if(!state.auction.currentLot) startAuction();
setInterval(()=>{ tickTimer(); simulateBotBids(); }, 1000);
document.getElementById('squad-search')?.addEventListener('input', renderSquads);
</script>
</body>
</html>

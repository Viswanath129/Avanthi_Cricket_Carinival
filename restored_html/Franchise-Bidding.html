<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Franchise Bidding — ACC</title>
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/reset.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/typography.css" />
<link rel="stylesheet" href="../css/layout.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/auction.css" />
<link rel="stylesheet" href="../css/dashboard.css" />
<link rel="stylesheet" href="../css/animations.css" />
</head>
<body>
<div class="bidding-layout">
  <div class="bidding-top">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;align-items:center;gap:10px"><div class="nav-logo" style="width:32px;height:32px">ACC</div><div><div style="font-weight:800;font-size:13px;letter-spacing:0.06em">TITANS BIDDING TERMINAL</div><div class="label" style="font-size:10px">FRANCHISE • 11 TEAMS • DEMO</div></div></div>
      <div class="connection-status connected" id="conn-status">CONNECTED</div>
    </div>
    <div style="margin-top:14px;display:flex;gap:8px;overflow:auto" id="top-strip"></div>
  </div>
  <div class="bidding-middle" id="middle"></div>
  <div class="bidding-bottom" id="bottom"></div>
</div>

<script type="module">
import { state, getPlayer, on, computeMaxBid, isBucketEligible } from '../js/state.js';
import { placeBid, passBid, reenter, tickTimer, startAuction, simulateBotBids } from '../js/auction.js';

let myFranchiseId = 'f1';
function myF(){ return state.franchises.find(f=>f.id===myFranchiseId); }

function renderTop(){
  const strip=document.getElementById('top-strip');
  strip.innerHTML='';
  state.franchises.forEach(f=>{
    const d=document.createElement('div');
    d.className=`franchise-card ${f.id===myFranchiseId?'active':f.status.toLowerCase()}`;
    d.style.minWidth='88px';
    d.innerHTML=`<div class="franchise-logo" style="width:28px;height:28px;font-size:10px">${f.short}</div><div><div class="franchise-name" style="font-size:10px">${f.short}${f.id===myFranchiseId?' • YOU':''}</div><div class="franchise-status" style="font-size:9px">${f.status}</div></div>`;
    d.onclick=()=>{ myFranchiseId=f.id; renderAll(); };
    strip.appendChild(d);
  });
}
function renderMiddle(){
  const lot=state.auction.currentLot;
  const pane=document.getElementById('middle');
  if(!lot){ pane.innerHTML='<div class="empty-state"><div class="empty-title">Auction not started</div></div>'; return; }
  const mf=myF();
  const maxBid=computeMaxBid(mf);
  const nextBid=state.auction.currentBid===0 ? lot.basePrice : (state.auction.currentBid<100?state.auction.currentBid+10:state.auction.currentBid<200?state.auction.currentBid+20:state.auction.currentBid+30);
  const bucketCheck=isBucketEligible(mf, lot);
  pane.innerHTML=`
    <div class="card"><div class="card-body" style="display:flex;gap:14px;align-items:center">
      <img src="${lot.photo}" style="width:72px;height:72px;border-radius:14px;object-fit:cover" />
      <div><div style="font-weight:800;font-size:18px;font-family:var(--font-display)">${lot.name}</div><div class="label">${lot.derivedType} • ${lot.bucket||'PG'} • BASE ${lot.basePrice}</div><div style="display:flex;gap:6px;margin-top:6px"><span class="chip">${lot.branch} Y${lot.year}</span><span class="chip">${lot.rollNumber}</span></div></div>
    </div></div>
    <div class="current-bid-wrap">
      <div class="price-label">CURRENT BID</div>
      <div class="current-bid-value mono" id="bid-val">${state.auction.currentBid||lot.basePrice}</div>
      <div class="price-credits">CREDITS • ${state.auction.currentBidder? state.franchises.find(f=>f.id===state.auction.currentBidder)?.name : 'NO BIDS'}</div>
      <div class="timer-ring" style="--size:84px;--progress:${(state.auction.timer/state.auction.timerMax)*100}%"><div class="timer-inner"><div class="timer-value mono" style="font-size:20px">${state.auction.timer}</div></div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="purse-bar"><div class="purse-top"><span class="purse-label">PURSE</span><span class="purse-value mono">₹${mf.purse}</span></div><div class="purse-progress"><div class="purse-fill" style="width:${(mf.purse/1000)*100}%"></div></div></div>
      <div class="purse-bar"><div class="purse-top"><span class="purse-label">MAX LEGAL BID</span><span class="purse-value mono" style="color:${nextBid>maxBid?'var(--color-danger)':'var(--color-success)'}">₹${maxBid}</span></div><div class="purse-label">NEXT BID ₹${nextBid}</div></div>
    </div>
    <div class="card"><div class="card-body"><div class="label">BUCKET STATUS • ${mf.squad.length}/15 • ${Object.values(mf.bucketCounts).reduce((a,b)=>a+b,0)} mandatory filled</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px">${Object.entries(mf.bucketCounts).map(([b,c])=>`<div class="bucket-card ${c>=2?'complete':''}" style="padding:8px"><div style="font-size:10px;font-weight:800">${b}</div><div class="mono" style="font-size:12px;font-weight:800">${c}/2</div></div>`).join('')}</div>${!bucketCheck.allowed? `<div class="scarcity-banner" style="margin-top:10px;background:var(--color-danger-bg);border-color:var(--color-danger-border);color:var(--color-danger)"><div class="icon" style="background:var(--color-danger);color:white">⊘</div>${bucketCheck.reason}</div>`:''}</div></div>
    ${state.auction.scarcity[lot.bucket]?.warning? `<div class="scarcity-banner"><div class="icon">⚠</div>DIPLOMA SCARCITY • ${state.auction.scarcity[lot.bucket].unsold} REMAINING • ${state.auction.scarcity[lot.bucket].needed} NEEDED</div>`:''}
  `;
}
function renderBottom(){
  const lot=state.auction.currentLot;
  const pane=document.getElementById('bottom');
  if(!lot) return;
  const mf=myF();
  const maxBid=computeMaxBid(mf);
  const nextBid=state.auction.currentBid===0 ? lot.basePrice : (state.auction.currentBid<100?state.auction.currentBid+10:state.auction.currentBid<200?state.auction.currentBid+20:state.auction.currentBid+30);
  const bucketCheck=isBucketEligible(mf, lot);
  const blocked = !bucketCheck.allowed || nextBid>maxBid || nextBid>mf.purse || mf.passed;
  let reason='';
  if(mf.passed) reason='You passed. Tap RE-ENTER to bid.';
  else if(!bucketCheck.allowed) reason=bucketCheck.reason;
  else if(nextBid>maxBid) reason=`Max legal bid ${maxBid}. Must reserve credits for remaining mandatory slots.`;
  else if(nextBid>mf.purse) reason=`Purse insufficient. Need ${nextBid}, have ${mf.purse}.`;

  pane.innerHTML=`
    ${blocked && reason? `<div style="padding:10px;border-radius:12px;background:var(--color-danger-bg);border:1px solid var(--color-danger-border);font-size:12px;line-height:1.4"><strong>BID BLOCKED</strong><br/>${reason}<br/><br/><span class="label">Maximum permissible bid: ${maxBid} credits</span></div>`:''}
    <button class="bid-btn ${blocked?'blocked':''}" id="bid-btn" ${blocked && !mf.passed?'disabled':''}>${mf.passed?'RE-ENTER AUCTION': blocked && !mf.passed? 'BID BLOCKED':'BID '+nextBid}</button>
    ${!mf.passed? `<button class="pass-btn" id="pass-btn">PASS • REVERSIBLE BEFORE HAMMER</button>` : ''}
    <div style="display:flex;justify-content:space-between;margin-top:4px"><span class="label">Purse ₹${mf.purse} • Squad ${mf.squad.length}</span><span class="label">NEXT ₹${nextBid} • MAX ₹${maxBid}</span></div>
  `;
  document.getElementById('bid-btn')?.addEventListener('click', ()=>{
    const mfNow=myF();
    if(mfNow.passed){ reenter(myFranchiseId); renderAll(); return; }
    const res=placeBid(myFranchiseId);
    if(!res.ok){
      const btn=document.getElementById('bid-btn');
      btn?.classList.add('shake');
      setTimeout(()=>btn?.classList.remove('shake'),320);
      // show toast
      const bottom=document.getElementById('bottom');
      const err=document.createElement('div');
      err.style.cssText='padding:10px;border-radius:12px;background:var(--color-danger-bg);border:1px solid var(--color-danger-border);color:var(--color-danger);font-size:12px';
      err.textContent=res.error;
      bottom.prepend(err);
      setTimeout(()=>err.remove(),2500);
    }
    renderAll();
  });
  document.getElementById('pass-btn')?.addEventListener('click', ()=>{ passBid(myFranchiseId); renderAll(); });
}
function renderAll(){ renderTop(); renderMiddle(); renderBottom(); }
on('auction:lot', renderAll); on('auction:bid', renderAll); on('auction:pass', renderAll); on('auction:timer', ()=>{ const v=document.querySelector('.timer-ring'); if(v){ v.style.setProperty('--progress', (state.auction.timer/state.auction.timerMax)*100+'%'); const tv=v.querySelector('.timer-value'); if(tv) tv.textContent=state.auction.timer; } const bv=document.getElementById('bid-val'); if(bv) bv.textContent=state.auction.currentBid||state.auction.currentLot?.basePrice; }); on('auction:hammer', renderAll); on('auction:state', renderAll);
renderAll();
if(!state.auction.currentLot) startAuction();
setInterval(()=>{ tickTimer(); simulateBotBids(); },1000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Avanthi Cricket Carnival — Player Auction Portal 2026</title>
  
  <!-- Typography System: Inter (UI/System), Georgia/Times New Roman (Editorial/Heritage), Roboto Mono (Tabular/Numerals) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ========================================================
       ACC DESIGN SYSTEM TOKENS — FERALUI PASTEL GLASS & LIGHT THEME
       ======================================================== */
    :root {
      /* Misted Sky & Pastel Foundation */
      --bg-misted-sky: #F6F9FF;
      --bg-rain-indigo: #9BE0E8;
      --bg-lavender: #C4B5F7;
      --bg-lilac-paper: #F8B8D9;

      /* Surfaces - White Pastel Glass */
      --surface-0: #F6F9FF;
      --surface-1: rgba(255, 255, 255, 0.88);
      --surface-2: rgba(255, 255, 255, 0.94);
      --surface-3: #FFFFFF;

      --glass-bg: rgba(255, 255, 255, 0.82);
      --glass-bg-elevated: rgba(255, 255, 255, 0.92);
      --glass-border: rgba(255, 255, 255, 0.95);
      --glass-border-subtle: rgba(15, 23, 42, 0.08);
      --glass-shadow: 0 12px 36px -4px rgba(15, 23, 42, 0.06), 0 4px 12px -2px rgba(15, 23, 42, 0.03);
      --glass-shadow-lg: 0 20px 48px -6px rgba(15, 23, 42, 0.09), 0 8px 16px -4px rgba(15, 23, 42, 0.04);

      /* Typography Colors - High Contrast Slate (AA/AAA Compliant) */
      --text-main: #0F172A;       /* Slate 900 - Primary headings & critical labels */
      --text-bright: #0F172A;     /* Mapped for display headings */
      --text-body: #1E293B;       /* Slate 800 - Standard UI body text */
      --text-muted: #334155;      /* Slate 700 - Captions, secondary info, table headers */
      --text-subtle: #64748B;     /* Slate 500 - Dividers, micro-labels */
      --text-faint: #94A3B8;      /* Slate 400 - Disabled states */

      /* Semantic Action & State Colors */
      --emerald-600: #059669;
      --emerald-500: #10B981;
      --emerald-100: #D1FAE5;
      --emerald-50: #ECFDF5;

      --amber-600: #D97706;
      --amber-500: #F59E0B;
      --amber-100: #FEF3C7;
      --amber-50: #FFFBEB;

      --rose-600: #E11D48;
      --rose-500: #F43F5E;
      --rose-100: #FFE4E6;
      --rose-50: #FFF1F2;

      --blue-600: #2563EB;
      --blue-500: #3B82F6;
      --blue-100: #DBEAFE;

      --color-green: #059669;      /* Emerald 600: Active / Connected / Success / Available */
      --color-green-light: #10B981;
      --color-orange: #D97706;     /* Amber 600: Auction / Current Bid / Primary Action */
      --color-yellow: #B45309;     /* Amber 700: Warning / Scarcity / Attention */
      --color-red: #E11D48;        /* Rose 600: Blocked / Error / Failed / Destructive */
      --color-grey: #64748B;       /* Slate 500: Inactive / Passed / Disabled */

      /* Borders */
      --border-subtle: rgba(15, 23, 42, 0.08);
      --border-medium: rgba(15, 23, 42, 0.14);
      --border-strong: rgba(15, 23, 42, 0.24);

      /* ========================================================
         ACC 2026 CENTRALIZED TWO-FONT TYPOGRAPHY SYSTEM
         ======================================================== */
      --font-ui: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-editorial: Georgia, "Times New Roman", Times, serif;
      --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --font-sans: var(--font-ui);
      --font-display: var(--font-editorial);

      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;
      --text-3xl: 1.875rem;
      --text-4xl: 2.25rem;
      --text-5xl: 3rem;
      --text-6xl: 4rem;

      --leading-tight: 1.1;
      --leading-normal: 1.5;
      --leading-relaxed: 1.65;

      /* Spacing Scale */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --space-16: 64px;

      /* Border Radii */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      /* Elevation Shadows */
      --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.12);
    }

    /* Reset & Base Setup */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background-color: var(--bg-misted-sky);
      color: var(--text-body);
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: var(--leading-normal);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      width: 100%;
    }

    body {
      background-color: var(--bg-misted-sky);
      color: var(--text-main);
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--font-ui);
    }

    /* ========================================================
       OPAL ANIMATED BACKGROUND — NATIVE VIDEO LIQUID GLASS UI
       ======================================================== */
    .opal-bg-root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: #d8e8fc url('Blue-sky-2048x1166.svg') center center / cover no-repeat;
    }

    .opal-bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.95;
      mix-blend-mode: normal;
      filter: saturate(1.10) brightness(1.02);
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
    }

    .opal-bg-scrim {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(246, 249, 255, 0.12) 0%, rgba(246, 249, 255, 0.32) 100%);
      pointer-events: none;
    }

    /* ========================================================
       FLOATING ACTION NOTICE (NON-BLOCKING SLIM GLASS PILL)
       ======================================================== */
    .action-notice {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: var(--radius-full);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .action-notice.active {
      opacity: 1;
      transform: translateY(0);
    }
    .action-notice-title {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-green);
    }
    .action-notice-sub {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-main);
    }

    /* App Wrapper */
    .app-wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .main-container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--space-6) var(--space-5) var(--space-16);
      flex: 1;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    /* ========================================================
       TYPOGRAPHY ROLES & SYSTEM HIERARCHY
       ======================================================== */
    .font-editorial { font-family: var(--font-editorial); }
    .font-ui { font-family: var(--font-ui); }
    .font-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .tabular-nums { font-variant-numeric: tabular-nums; }

    /* LEVEL 1: Major event / hero title (Georgia 700) */
    .display-hero, h1.editorial-hero {
      font-family: var(--font-editorial);
      font-size: clamp(2rem, 5vw, 3.85rem); /* 30–36px mobile, 36–44px tablet, 48–64px desktop */
      font-weight: 700;
      line-height: var(--leading-tight);
      letter-spacing: -0.03em;
      color: var(--text-bright);
    }

    /* LEVEL 2: Major section heading (Georgia 700) */
    .section-title, h2.editorial-section {
      font-family: var(--font-editorial);
      font-size: clamp(1.625rem, 3.2vw, 2.5rem); /* 26–30px mobile, 30–36px tablet, 36–44px desktop */
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.02em;
      color: var(--text-bright);
    }

    /* LEVEL 3: Operational section / Dashboard title (Inter 700) */
    .operational-title, h3.operational-title, .dashboard-title {
      font-family: var(--font-ui);
      font-size: clamp(1.35rem, 2vw, 1.75rem); /* 22–28px */
      font-weight: 700;
      line-height: 1.15;
      color: var(--text-bright);
    }

    /* LEVEL 4: Card / component title (Inter 600–700) */
    .card-title {
      font-family: var(--font-ui);
      font-size: 1.0625rem; /* 17px */
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-bright);
    }

    /* LEVEL 5: Body (Inter 400–500, max 75 characters reading width) */
    p, .body-text {
      font-family: var(--font-ui);
      font-size: clamp(0.9375rem, 1vw, 1.0625rem); /* 15–16px mobile, 16–17px desktop */
      line-height: var(--leading-relaxed);
      max-width: 75ch; /* 65–75 characters */
      color: var(--text-body);
    }

    /* LEVEL 6: Metadata (Inter 400–500) */
    .metadata-text, .text-meta {
      font-family: var(--font-ui);
      font-size: 0.8125rem; /* 12–13px */
      font-weight: 500;
      color: var(--text-muted);
    }

    /* LEVEL 7: Micro-label (Inter 600–700) */
    .label-micro {
      font-family: var(--font-ui);
      font-size: 0.72rem; /* 11–12px */
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      line-height: 1.2;
    }

    /* AUCTION PRICE & TABULAR NUMERICAL HIERARCHY */
    .price-display,
    .current-bid-val,
    .auction-current-bid {
      font-family: var(--font-ui);
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .auction-timer-widget,
    .timer-display,
    .timer-val {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Tabular Numerals across all numerical displays */
    .admin-metrics-grid .font-mono,
    .admin-telemetry-grid .font-mono,
    table td .font-mono,
    .stat-value,
    .kpi-value {
      font-variant-numeric: tabular-nums;
    }

    /* Table Typography */
    table th {
      font-family: var(--font-ui);
      font-size: 0.75rem; /* 12px */
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    table td {
      font-family: var(--font-ui);
      font-size: 0.875rem; /* 14px */
      font-weight: 500;
    }
    table td strong {
      font-weight: 600;
      font-size: 0.9375rem; /* 15px */
    }

    /* Status Labels */
    .status-badge {
      font-family: var(--font-ui);
      font-size: 0.6875rem; /* 11px */
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Surfaces - Liquid Pastel Glass System */
    .surface-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.80);
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .surface-card:hover {
      background: rgba(255, 255, 255, 0.75);
      border-color: rgba(255, 255, 255, 1);
      box-shadow: 0 14px 38px rgba(15, 23, 42, 0.07);
    }

    .surface-elevated {
      background: rgba(255, 255, 255, 0.76);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.90);
      border-radius: var(--radius-lg);
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.06);
    }

    .surface-subtle {
      background: rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.60);
      border-radius: var(--radius-sm);
    }

    /* Text-Based Status Badges (No Icons, Clear Typography) */
    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 9px;
      font-size: 0.6875rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 4px;
      border: 1px solid transparent;
      line-height: 1.2;
      white-space: nowrap;
    }
    .status-live {
      background: rgba(5, 150, 105, 0.12);
      color: var(--color-green);
      border-color: rgba(5, 150, 105, 0.35);
    }
    .status-inplay {
      background: rgba(217, 119, 6, 0.14);
      color: var(--color-orange);
      border-color: rgba(217, 119, 6, 0.4);
    }
    .status-passed {
      background: rgba(100, 116, 139, 0.12);
      color: var(--color-grey);
      border-color: rgba(100, 116, 139, 0.3);
    }
    .status-blocked {
      background: rgba(225, 29, 72, 0.12);
      color: var(--color-red);
      border-color: rgba(225, 29, 72, 0.35);
    }
    .status-warning, .status-scarcity {
      background: rgba(217, 119, 6, 0.12);
      color: var(--color-yellow);
      border-color: rgba(217, 119, 6, 0.35);
    }
    .status-sold {
      background: rgba(5, 150, 105, 0.15);
      color: var(--color-green);
      border-color: rgba(5, 150, 105, 0.45);
    }
    .status-unsold {
      background: rgba(225, 29, 72, 0.10);
      color: var(--color-red);
      border-color: rgba(225, 29, 72, 0.3);
    }
    .status-connected {
      background: rgba(5, 150, 105, 0.12);
      color: var(--color-green);
      border-color: rgba(5, 150, 105, 0.3);
    }
    .status-offline {
      background: rgba(225, 29, 72, 0.10);
      color: var(--color-red);
      border-color: rgba(225, 29, 72, 0.3);
    }
    .status-reconnecting {
      background: rgba(217, 119, 6, 0.12);
      color: var(--color-yellow);
      border-color: rgba(217, 119, 6, 0.3);
    }
    @keyframes livePulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    /* Button System */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      font-family: var(--font-ui);
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s ease;
      white-space: nowrap;
      min-height: 44px;
      user-select: none;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: linear-gradient(135deg, #059669, #10B981);
      color: #FFFFFF;
      border: none;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.28);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #047857, #059669);
      box-shadow: 0 6px 18px rgba(5, 150, 105, 0.36);
    }
    .btn-auction {
      background: linear-gradient(135deg, #D97706, #F59E0B);
      color: #FFFFFF;
      border: none;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.32);
    }
    .btn-auction:hover {
      background: linear-gradient(135deg, #B45309, #D97706);
    }
    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.90);
      color: var(--text-main);
      border: 1px solid var(--border-medium);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }
    .btn-secondary:hover {
      background-color: #FFFFFF;
      border-color: var(--border-strong);
    }
    .btn-danger {
      background-color: rgba(225, 29, 72, 0.1);
      color: var(--color-red);
      border-color: rgba(225, 29, 72, 0.3);
    }
    .btn-danger:hover {
      background-color: var(--color-red);
      color: #FFFFFF;
    }
    .btn-bid {
      background: linear-gradient(135deg, #D97706, #F59E0B);
      color: #FFFFFF;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      min-height: 64px;
      border-radius: var(--radius-md);
      width: 100%;
      box-shadow: 0 8px 24px rgba(217, 119, 6, 0.35);
      border: none;
    }
    .btn-bid:hover { background: linear-gradient(135deg, #B45309, #D97706); }
    .btn-bid:disabled {
      background: rgba(148, 163, 184, 0.2);
      color: var(--text-faint);
      border: 1px solid var(--border-subtle);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Forms */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: var(--space-4);
    }
    .form-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .form-input, .form-select {
      background-color: rgba(255, 255, 255, 0.95);
      border: 1.5px solid rgba(15, 23, 42, 0.12);
      color: var(--text-main);
      font-family: var(--font-ui);
      font-size: 0.9375rem;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      min-height: 48px;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
      width: 100%;
    }
    .form-input:focus, .form-select:focus {
      border-color: var(--color-green);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
    }
    .form-input::placeholder { color: var(--text-faint); }

    /* Header Nav */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 70px;
      background: rgba(255, 255, 255, 0.68);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.03);
      padding: 0 var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-inner {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
    }
    .brand-mark {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      cursor: pointer;
      text-decoration: none;
      user-select: none;
    }
    .brand-logo-img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: contain;
      flex-shrink: 0;
      background: transparent;
      filter: drop-shadow(0 2px 6px rgba(15, 23, 42, 0.08));
    }
    .brand-logo-text {
      font-family: var(--font-editorial);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      line-height: 1;
    }
    .brand-logo-full {
      font-family: var(--font-ui);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-left: 1px solid var(--border-medium);
      padding-left: var(--space-3);
      line-height: 1.2;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .nav-link-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.16s ease;
      white-space: nowrap;
    }
    .nav-link-btn:hover {
      color: var(--text-main);
      background: rgba(15, 23, 42, 0.04);
    }
    .nav-link-btn.active {
      color: var(--color-green);
      background: rgba(5, 150, 105, 0.08);
      border-color: rgba(5, 150, 105, 0.25);
    }

    .header-status-area {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    body.projector-active .app-header { display: none !important; }

    /* Footer */
    .app-footer {
      border-top: 1px solid var(--border-subtle);
      background-color: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

    }
    .footer-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: var(--space-8);
    }
    .footer-brand {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .footer-nav {
      display: flex;
      gap: var(--space-6);

    }
    .footer-link {
      color: var(--text-muted);

      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.16s ease;

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }
    .modal-dialog {
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-lg);
      max-width: 620px;
      width: 100%;
      max-height: 90vh;
      max-height: 90dvh;
      overflow-y: auto;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
    }

    /* ========================================================
       HOURGLASS AUCTION TIMER ANIMATION (SVG + CSS KEYFRAMES)
       ======================================================== */
    .hourglass-loader {
      --dur: 2s;
      --hue: 155;
      display: block;
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }
    .hourglass-loader.warning {
      --hue: 35;
    }
    .hourglass-loader.critical {
      --hue: 0;
    }
    .hourglass-loader.paused *,
    .hourglass-loader.time-up *,
    .hourglass-loader.time-up,
    .hourglass-loader.stopped *,
    .hourglass-loader.stopped {
      animation: none !important;
      animation-play-state: paused !important;
    }

    /* ========================================================
       FIRST ORIGINAL UIVERSE SPEEDER LOADING ANIMATION
       ======================================================== */
    .speeder-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(246, 249, 255, 0.94);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      pointer-events: all;
    }
    .speeder-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .speeder-wrapper {
      position: relative;
      width: 320px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .speeder-loader {
      animation: speeder-anim 0.4s linear infinite;
      position: relative;
    }
    .speeder-loader > span {
      height: 5px;
      width: 35px;
      background: #0F172A;
      position: absolute;
      top: -19px;
      left: 60px;
      border-radius: 2px 10px 1px 0;
    }
    .speeder-base span {
      position: absolute;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-right: 100px solid #059669;
      border-bottom: 6px solid transparent;
    }
    .speeder-base span:before {
      content: "";
      height: 22px;
      width: 22px;
      border-radius: 50%;
      background: #059669;
      position: absolute;
      right: -110px;
      top: -16px;
    }
    .speeder-base span:after {
      content: "";
      position: absolute;
      width: 0;
      height: 0;
      border-top: 0 solid transparent;
      border-right: 55px solid #059669;
      border-bottom: 16px solid transparent;
      top: -16px;
      right: -98px;
    }
    .speeder-face {
      position: absolute;
      height: 12px;
      width: 20px;
      background: #059669;
      border-radius: 20px 20px 0 0;
      transform: rotate(-40deg);
      right: -125px;
      top: -15px;
    }
    .speeder-face:after {
      content: "";
      height: 12px;
      width: 12px;
      background: #0F172A;
      right: 4px;
      top: 7px;
      position: absolute;
      transform: rotate(40deg);
      transform-origin: 50% 50%;
      border-radius: 0 0 0 2px;
    }
    .speeder-loader > span > span {
      position: absolute;
      width: 30px;
      height: 1.5px;
      background: #0F172A;
    }
    .speeder-loader > span > span:nth-child(1) { animation: speeder-fazer1 0.2s linear infinite; }
    .speeder-loader > span > span:nth-child(2) { top: 3px; animation: speeder-fazer2 0.4s linear infinite; }
    .speeder-loader > span > span:nth-child(3) { top: 1px; animation: speeder-fazer3 0.4s linear infinite; animation-delay: -1s; }
    .speeder-loader > span > span:nth-child(4) { top: 4px; animation: speeder-fazer4 1s linear infinite; animation-delay: -1s; }

    @keyframes speeder-anim {
      0% { transform: translate(2px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -3px) rotate(-1deg); }
      20% { transform: translate(-2px, 0px) rotate(1deg); }
      30% { transform: translate(1px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 3px) rotate(-1deg); }
      60% { transform: translate(-1px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-2px, -1px) rotate(1deg); }
      90% { transform: translate(2px, 1px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
    @keyframes speeder-fazer1 {
      0% { left: 0; }
      100% { left: -80px; opacity: 0; }
    }
    @keyframes speeder-fazer2 {
      0% { left: 0; }
      100% { left: -100px; opacity: 0; }
    }
    @keyframes speeder-fazer3 {
      0% { left: 0; }
      100% { left: -50px; opacity: 0; }
    }
    @keyframes speeder-fazer4 {
      0% { left: 0; }
      100% { left: -150px; opacity: 0; }
    }

    .longfazers {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .longfazers span {
      position: absolute;
      height: 2px;
      width: 25%;
      background: #059669;
    }
    .longfazers span:nth-child(1) { top: 20%; animation: lf1 0.6s linear infinite; animation-delay: -5s; }
    .longfazers span:nth-child(2) { top: 40%; animation: lf2 0.8s linear infinite; animation-delay: -1s; }
    .longfazers span:nth-child(3) { top: 60%; animation: lf3 0.6s linear infinite; }
    .longfazers span:nth-child(4) { top: 80%; animation: lf4 0.5s linear infinite; animation-delay: -3s; }

    @keyframes lf1 { 0% { left: 200%; } 100% { left: -200%; opacity: 0; } }
    @keyframes lf2 { 0% { left: 200%; } 100% { left: -200%; opacity: 0; } }
    @keyframes lf3 { 0% { left: 200%; } 100% { left: -200%; opacity: 0; } }
    @keyframes lf4 { 0% { left: 200%; } 100% { left: -200%; opacity: 0; } }

    .speeder-msg {
      margin-top: 24px;
      font-family: var(--font-display, "Space Grotesk", sans-serif);
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-bright, #0F172A);
      text-align: center;
    }
    .speeder-sub {
      margin-top: 6px;
      font-size: 0.82rem;
      color: var(--text-muted, #475569);
      text-align: center;
      font-family: var(--font-sans, "Inter", sans-serif);
    }
    .live-users-pill {
      display: none !important; /* Temporarily hidden per user instruction - do not remove */
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(5, 150, 105, 0.1);
      border: 1px solid rgba(5, 150, 105, 0.2);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
    }

    .loader__glare-top,
    .loader__glare-bottom,
    .loader__model,
    .loader__motion-thick,
    .loader__motion-medium,
    .loader__motion-thin,
    .loader__sand-drop,
    .loader__sand-fill,
    .loader__sand-grain-left,
    .loader__sand-grain-right,
    .loader__sand-line-left,
    .loader__sand-line-right,
    .loader__sand-mound-top,
    .loader__sand-mound-bottom {
      animation-duration: var(--dur);
      animation-timing-function: cubic-bezier(0.83, 0, 0.17, 1);
      animation-iteration-count: infinite;
    }
    .loader__glare-top { animation-name: glare-top; }
    .loader__glare-bottom { animation-name: glare-bottom; }
    .loader__model {
      animation-name: loader-flip;
      transform-origin: 12.25px 16.75px;
    }
    .loader__motion-thick,
    .loader__motion-medium,
    .loader__motion-thin {
      transform-origin: 26px 26px;
    }
    .loader__motion-thick { animation-name: motion-thick; }
    .loader__motion-medium { animation-name: motion-medium; }
    .loader__motion-thin { animation-name: motion-thin; }
    .loader__sand-drop { animation-name: sand-drop; }
    .loader__sand-fill { animation-name: sand-fill; }
    .loader__sand-grain-left { animation-name: sand-grain-left; }
    .loader__sand-grain-right { animation-name: sand-grain-right; }
    .loader__sand-line-left { animation-name: sand-line-left; }
    .loader__sand-line-right { animation-name: sand-line-right; }
    .loader__sand-mound-top { animation-name: sand-mound-top; }
    .loader__sand-mound-bottom {
      animation-name: sand-mound-bottom;
      transform-origin: 12.25px 31.5px;
    }

    @keyframes loader-flip {
      from { transform: translate(13.75px, 9.25px) rotate(-180deg); }
      24%, to { transform: translate(13.75px, 9.25px) rotate(0); }
    }
    @keyframes glare-top {
      from { stroke: rgba(255, 255, 255, 0); }
      24%, to { stroke: rgba(255, 255, 255, 0.9); }
    }
    @keyframes glare-bottom {
      from { stroke: rgba(255, 255, 255, 0.9); }
      24%, to { stroke: rgba(255, 255, 255, 0); }
    }
    @keyframes motion-thick {
      from {
        animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
        stroke: rgba(5, 150, 105, 0);
        stroke-dashoffset: 153.94;
        transform: rotate(0.67turn);
      }
      20% {
        animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
        stroke: rgba(5, 150, 105, 0.75);
        stroke-dashoffset: 141.11;
        transform: rotate(1turn);
      }
      40%, to {
        stroke: rgba(5, 150, 105, 0);
        stroke-dashoffset: 153.94;
        transform: rotate(1.33turn);
      }
    }
    @keyframes motion-medium {
      from, 8% {
        animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
        stroke: rgba(245, 158, 11, 0);
        stroke-dashoffset: 153.94;
        transform: rotate(0.5turn);
      }
      20% {
        animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
        stroke: rgba(245, 158, 11, 0.85);
        stroke-dashoffset: 147.53;
        transform: rotate(0.83turn);
      }
      32%, to {
        stroke: rgba(245, 158, 11, 0);
        stroke-dashoffset: 153.94;
        transform: rotate(1.17turn);
      }
    }
    @keyframes motion-thin {
      from, 4% {
        animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
        stroke: rgba(15, 23, 42, 0);
        stroke-dashoffset: 153.94;
        transform: rotate(0.33turn);
      }
      24% {
        animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
        stroke: rgba(15, 23, 42, 0.45);
        stroke-dashoffset: 134.7;
        transform: rotate(0.67turn);
      }
      44%, to {
        stroke: rgba(15, 23, 42, 0);
        stroke-dashoffset: 153.94;
        transform: rotate(1turn);
      }
    }
    @keyframes sand-drop {
      from, 10% { animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0); stroke-dashoffset: 1; }
      70%, to { stroke-dashoffset: -107; }
    }
    @keyframes sand-fill {
      from, 10% { animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0); stroke-dashoffset: 55; }
      70%, to { stroke-dashoffset: -54; }
    }
    @keyframes sand-grain-left {
      from, 10% { animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0); stroke-dashoffset: 29; }
      70%, to { stroke-dashoffset: -22; }
    }
    @keyframes sand-grain-right {
      from, 10% { animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0); stroke-dashoffset: 27; }
      70%, to { stroke-dashoffset: -24; }
    }
    @keyframes sand-line-left {
      from, 10% { animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0); stroke-dashoffset: 53; }
      70%, to { stroke-dashoffset: -55; }
    }
    @keyframes sand-line-right {
      from, 10% { animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0); stroke-dashoffset: 14; }
      70%, to { stroke-dashoffset: -24.5; }
    }
    @keyframes sand-mound-top {
      from, 10% { animation-timing-function: linear; transform: translate(0, 0); }
      15% { animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0); transform: translate(0, 1.5px); }
      51%, to { transform: translate(0, 13px); }
    }
    @keyframes sand-mound-bottom {
      from, 31% { animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1); transform: scale(1, 0); }
      56%, to { transform: scale(1, 1); }
    }

    /* Timer Widget Container with numbers and animated hourglass */
    .auction-timer-widget {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.04);
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    .auction-timer-widget.warning {
      border-color: rgba(245, 158, 11, 0.6);
      background: rgba(254, 243, 199, 0.75);
    }
    .auction-timer-widget.critical {
      border-color: rgba(239, 68, 68, 0.6);
      background: rgba(254, 226, 226, 0.75);
      animation: timerPulse 0.8s ease infinite alternate;
    }
    @keyframes timerPulse {
      from { box-shadow: 0 4px 18px rgba(239, 68, 68, 0.1); }
      to { box-shadow: 0 4px 24px rgba(239, 68, 68, 0.3); }
    }
    .timer-countdown-info {
      display: flex;
      flex-direction: column;
    }
    .timer-countdown-number {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1;
      color: var(--text-bright);
    }
    .auction-timer-widget.warning .timer-countdown-number {
      color: var(--color-orange);
    }
    .auction-timer-widget.critical .timer-countdown-number {
      color: var(--color-red);
    }
    .timer-countdown-unit {
      font-size: 0.6875rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 4px;

    const BRANCH_CODES = {
      '01': 'CIVIL', '02': 'EEE', '03': 'MECH', '04': 'ECE', '05': 'CSE',
      '12': 'IT', '42': 'CSM', '44': 'CSD',
      'CM': 'CM', 'EC': 'EC', 'EE': 'EE', 'M': 'M'
    };

    function parseRollNumber(rollInput) {
      if (!rollInput || typeof rollInput !== 'string') {
        return {
          valid: false, program: 'B.Tech', branch: 'CSE', entryType: 'Regular',
          admissionYear: 2026, year: 1, bucket: 'B1', label: 'B.Tech 1st Year (B1)'
        };
      }
      const roll = rollInput.trim().toUpperCase();

      // 1. PG Programs (MBA / MCA / M.Tech) -> M6 (No mandatory squad quota)
      if (roll.includes('MBA') || roll.includes('MCA') || roll.includes('MTECH') || roll.includes('M.TECH')) {
        let pgBranch = 'MBA';
        if (roll.includes('MCA')) pgBranch = 'MCA';
        if (roll.includes('MTECH') || roll.includes('M.TECH')) pgBranch = 'M.Tech';
        return {
          valid: true, program: 'PG', branch: pgBranch, entryType: 'Regular',
          admissionYear: 2025, year: 2, bucket: 'M6', label: 'PG — MBA/MCA/M.Tech (M6)'
        };
      }

      // 2. Diploma: Format YY597-BRANCH-NUM or YY597BRANCH... -> strictly D5
      const diplomaMatch = roll.match(/^(\d{2})597-?([A-Z]+)-?\d+/);
      if (diplomaMatch) {
        const yy = parseInt(diplomaMatch[1], 10);
        const branchCode = diplomaMatch[2];
        const branch = BRANCH_CODES[branchCode] || branchCode;
        const studyYear = Math.max(1, Math.min(3, (26 - yy) + 1));
        return {
          valid: true, program: 'Diploma', branch: branch, entryType: 'Regular',
          admissionYear: 2000 + yy, year: studyYear, bucket: 'D5', label: `Diploma Year ${studyYear} (D5)`
        };
      }

      // 3. B.Tech Regular (YY811A...) and Lateral Entry (YY815A...)
      const btechMatch = roll.match(/^(\d{2})81(1|5)A([0-9A-Z]{2})\d+/);
      if (btechMatch) {
        const yy = parseInt(btechMatch[1], 10);
        const isLateral = btechMatch[2] === '5';
        const branchCode = btechMatch[3];
        const branch = BRANCH_CODES[branchCode] || (branchCode === '04' ? 'ECE' : branchCode === '05' ? 'CSE' : 'CSE');
        let studyYear = (26 - yy) + (isLateral ? 2 : 1);
        if (studyYear < 1) studyYear = 1;
        if (studyYear > 4) studyYear = 4;
        const bucket = `B${studyYear}`;
        return {
          valid: true, program: 'B.Tech', branch: branch, entryType: isLateral ? 'Lateral' : 'Regular',
          admissionYear: 2000 + yy, year: studyYear, bucket: bucket,
          label: `B.Tech ${studyYear === 1 ? '1st' : studyYear === 2 ? '2nd' : studyYear === 3 ? '3rd' : '4th'} Year (${bucket})`
        };
      }

      return {
        valid: false, program: 'B.Tech', branch: 'CSE', entryType: 'Regular',
        admissionYear: 2026, year: 1, bucket: 'B1', label: 'B.Tech 1st Year (B1)'
      };

    function isPlayerPubliclyVisible(player) {
      if (!player) return false;
      if (player.deleted === true) return false;
      if (player.publicVisibility === false) return false;
      const s = String(player.status || '').toUpperCase();
      const a = String(player.approvalStatus || '').toUpperCase();
      const v = String(player.verificationStatus || '').toUpperCase();
      const acc = String(player.accountStatus || 'ACTIVE').toUpperCase();

      // Explicit rejections / blocks / deletions are NEVER visible
      if (s === 'DELETED' || a === 'DELETED' || s === 'ARCHIVED' || a === 'ARCHIVED') return false;

      // Active approved / verified players are visible
      if ((v === 'VERIFIED' || a === 'APPROVED') && (s === 'AVAILABLE' || s === 'APPROVED' || s === 'SOLD' || s === 'UNSOLD')) {
        if (s === 'BLOCKED' || a === 'BLOCKED' || v === 'BLOCKED' || player.isBlocked) return false;
        return true;
      }

      if (s === 'BLOCKED' || a === 'BLOCKED' || v === 'BLOCKED' || player.isBlocked) return false;
      if (s === 'REJECTED' || a === 'REJECTED' || v === 'REJECTED') return false;
      if (s === 'CHANGES_REQUIRED' || a === 'CHANGES_REQUIRED' || v === 'CHANGES_REQUIRED') return false;
      if (acc === 'DISABLED' || acc === 'LOCKED') return false;

      // Pending checks
      if (s === 'PENDING' || s === 'PENDING_APPROVAL' || s === 'PENDING_VERIFICATION') return false;
      if (v === 'PENDING_VERIFICATION') return false;
      if (a === 'PENDING' || a === 'PENDING_APPROVAL') return false;

      // Must be approved / available / sold / unsold
      const isApprovedState = (s === 'APPROVED' || s === 'AVAILABLE' || s === 'SOLD' || s === 'UNSOLD');
      return isApprovedState;
    }

    function syncPlayerToFirebase(p, action) {
      if (!p) return;
      const docKey = (p.rollNumberNormalized || p.roll || String(p.id)).toUpperCase();

      if (typeof fbDb !== 'undefined' && fbDb) {
        if (action === 'DELETE') {
          fbDb.collection("players").doc(docKey).delete().catch(() => {});
          fbDb.collection("publicPlayers").doc(docKey).delete().catch(() => {});
          fbDb.collection("deletedPlayers").doc(docKey).set({ ...p, status: 'DELETED', publicVisibility: false }).catch(() => {});
        } else {
          fbDb.collection("players").doc(docKey).set(p, { merge: true }).catch(() => {});

          if (isPlayerPubliclyVisible(p)) {
            const publicPayload = {
              id: p.id,
              name: p.name,
              roll: p.roll,
              program: p.program || 'B.Tech',
              branch: p.department || p.branch || 'CSE',
              year: p.year || 1,
              bucket: p.bucket || 'B1',
              derivedType: p.derivedType || p.role || 'ALL-ROUNDER',
              battingStyle: p.battingStyle || 'RIGHT HAND',
              bowlingArm: p.bowlingArm || '',
              bowlingType: p.bowlingType || '',
              basePrice: p.basePrice || 60,
              photo: p.photo || '',
              status: p.status || 'APPROVED',
              publicVisibility: true,
              soldTo: p.soldTo || null,
              soldPrice: p.soldPrice || null
            };
            fbDb.collection("publicPlayers").doc(docKey).set(publicPayload, { merge: true }).catch(() => {});
            fbDb.collection("deletedPlayers").doc(docKey).delete().catch(() => {});
          } else {
            fbDb.collection("publicPlayers").doc(docKey).delete().catch(() => {});
          }
        }
      }

      if (typeof broadcastChannel !== 'undefined' && broadcastChannel) {
        try {
          broadcastChannel.postMessage({
            type: "PLAYER_STATE_MUTATION",
            action: action,
            playerId: p.id,
            roll: docKey,
            player: p
          });

    function getCurrentUserContext() {

      const isAuth = !!(u && u.uid && u.role && u.role !== 'PUBLIC' && u.role !== 'SPECTATOR');
      let canonicalRole = u ? u.role : 'PUBLIC';
      if (canonicalRole === 'FRANCHISE') {

      }
      return {
        authenticated: isAuth,
        uid: u ? (u.uid || null) : null,
        role: canonicalRole,
        rawRole: u ? u.role : 'PUBLIC',
        name: u ? (u.name || 'User') : 'Public Guest',
        playerId: u ? (u.playerId || u.username || null) : null,

        isFranchise: canonicalRole === 'FRANCHISE_COORDINATOR' || canonicalRole === 'FRANCHISE_TEAM_LEADER' || canonicalRole === 'FRANCHISE',
        isPlayer: canonicalRole === 'PLAYER',
        mustChangePassword: !!(u && u.mustChangePassword)
      };
    }

    function mapAuthAndAuctionError(err) {
      const code = (err && (err.code || err.message)) ? String(err.code || err.message) : '';
      if (code.includes("auth/invalid-credential") || code.includes("auth/wrong-password") || code.includes("auth/user-not-found") || code.includes("INVALID_CREDENTIALS")) {
        return "INVALID_CREDENTIALS: Username, roll number, or password incorrect.";
      }
      if (code.includes("ACCOUNT_DISABLED") || code.includes("auth/user-disabled")) {
        return "ACCOUNT_DISABLED: Your workspace access has been suspended by the Tournament Directorate.";
      }
      if (code.includes("ACCESS_DENIED") || code.includes("permission-denied")) {
        return "ACCESS_DENIED: You do not have permission to perform this operational action.";
      }
      if (code.includes("DUPLICATE_ROLL")) {
        return "DUPLICATE_ROLL: This roll number is already registered.";
      }
      if (code.includes("DUPLICATE_MOBILE")) {
        return "DUPLICATE_MOBILE: This mobile number is already linked to a registered candidate.";
      }
      if (code.includes("AUCTION_STATE_UPDATED") || code.includes("STALE_BID")) {
        return "AUCTION_STATE_CHANGED: The active lot was updated by another franchise. Please review the latest bid.";
      }
      if (code.includes("network") || code.includes("unavailable")) {
        return "NETWORK_ERROR: Connection lost. Reconnecting to authoritative auction node...";
      }
      return "ACTION_FAILED: Please verify your input or contact Tournament Directorate.";
    }

    function validateRegRollAcademic() {
      const roll = (regFormData.roll || '').trim().toUpperCase();
      const notice = document.getElementById("regAcademicDiscrepancyNotice");
      if (!roll) {
        if (notice) notice.style.display = "none";
        return;
      }

      // LIVE DUPLICATE ROLL NUMBER CHECK
      const normalizedRoll = roll.replace(/\s+/g, '');
      const existingPlayer = players.find(p => p.status !== 'MERGED' && (p.roll || '').trim().toUpperCase().replace(/\s+/g, '') === normalizedRoll);
      if (existingPlayer) {
        if (notice) {
          notice.style.display = "block";
          notice.innerHTML = `<span style="color: var(--color-red); font-weight: 800;">DUPLICATE ROLL DETECTED:</span> Roll ${normalizedRoll} is already registered (${existingPlayer.name} - #${existingPlayer.id}). Duplicate registration is not permitted.`;
        }
        showToast(`Roll number ${normalizedRoll} is already registered!`, "error");
        return;
      }
      const parsed = parseRollNumber(roll);
      if (!parsed.valid) {
        if (notice) {
          notice.style.display = "block";
          notice.innerHTML = "<strong>ACADEMIC DETAILS NEED VERIFICATION:</strong> Roll format not fully recognized. Your manual selections are preserved and will be verified by Super Admin.";
        }
        return;
      }

      let hasMismatch = false;
      let note = "";
      if (parsed.program !== regFormData.program) {
        hasMismatch = true;
        note = `Roll indicates ${parsed.program}, while ${regFormData.program} is selected.`;
      } else if (parsed.program === 'B.Tech' && parsed.year !== regFormData.year) {
        hasMismatch = true;
        note = `Roll progression indicates Year ${parsed.year}, while Year ${regFormData.year} is selected (e.g. detained/reconciled).`;
      }

      if (notice) {
        if (hasMismatch) {
          notice.style.display = "block";
          notice.innerHTML = `<strong>ACADEMIC DETAILS NEED VERIFICATION:</strong> ${note} Your chosen values remain active and will be reviewed by Super Admin.`;
          regFormData.yearDiscrepancy = true;
          regFormData.discrepancyNote = note;
        } else {
          notice.style.display = "none";
          regFormData.yearDiscrepancy = false;
          regFormData.discrepancyNote = "";
        }
      }
    }

    function adminVerifyPlayer(id) {
      const p = players.find(x => x.id == id || x.playerId == id || String(x.id) === String(id) || (x.roll && String(x.roll).toLowerCase() === String(id).toLowerCase()));
      if (!p) return;
      p.verificationStatus = 'VERIFIED';
      p.approvalStatus = 'APPROVED';
      p.status = 'AVAILABLE';
      p.publicVisibility = true;
      p.auctionEligible = true;
      p.approvedAt = new Date().toISOString();
      p.approvedBy = currentUser.uid || 'usr_superadmin';
      delete p.correctionNote;
      delete p.blockReason;
      auditLog.unshift({
        time: new Date().toLocaleTimeString(),
        action: "PLAYER VERIFIED",
        details: `${p.name} (${p.roll}) officially verified by ${currentUser.name} (${currentUser.role}). Released to public and auction pool.`
      });
      saveDatabase();
      syncPlayerToFirebase(p, 'APPROVE');
      broadcastAuthoritativeState();
      showToast(`Player ${p.name} verified and released to public & auction pool!`, "success");
      renderCurrentView();

    function saveAdminProfile() {
      const name = (document.getElementById("adminProfName")?.value || "").trim();
      const phone = (document.getElementById("adminProfPhone")?.value || "").trim();
      const email = (document.getElementById("adminProfEmail")?.value || "").trim();
      const title = (document.getElementById("adminProfDesignation")?.value || "").trim();
      const dept = (document.getElementById("adminProfDept")?.value || "").trim();
      const photo = (document.getElementById("adminProfPhoto")?.value || "").trim();

      if (!name) {
        showToast("Full name cannot be empty", "error");
        return;
      }

      currentUser.name = name;
      if (phone) currentUser.mobile = phone;
      if (email) currentUser.email = email;
      if (title) currentUser.title = title;
      if (dept) currentUser.department = dept;
      if (photo) currentUser.photo = photo;

      const userInList = users.find(u => u.username === currentUser.username || (currentUser.email && u.email === currentUser.email));
      if (userInList) {
        userInList.name = name;
        if (phone) userInList.mobile = phone;
        if (email) userInList.email = email;
        if (title) userInList.title = title;
        if (dept) userInList.department = dept;
        if (photo) userInList.photo = photo;
      }

      localStorage.setItem("acc_current_user_2026", JSON.stringify(currentUser));
      saveDatabase();

      if (typeof fbDb !== 'undefined' && fbDb && currentUser.uid) {
        fbDb.collection("users").doc(currentUser.uid).set({
          name: name,
          mobile: phone,
          email: email,
          title: title,
          department: dept,
          photo: photo,
          updatedAt: new Date().toISOString()
        }, { merge: true }).catch(() => {});
      }

      auditLog.unshift({
        time: new Date().toLocaleTimeString(),
        action: "ADMIN PROFILE UPDATED",
        details: `Profile updated for ${name} (${currentUser.role})`
      });

      showToast("Profile details updated successfully", "success");
      closeModal();
      renderHeaderNav();
      renderCurrentView();
    }

        if (p) {
          p.credentialsDelivered = true;
          p.accountStatus = 'ACTIVE';
          auditLog.unshift({

            action: "CREDENTIAL_DELIVERED",
            actorUid: currentUser.uid || 'usr_superadmin',
            role: currentUser.role,
            targetId: p.roll || String(p.id),
            timestamp: new Date().toISOString(),
            details: `Credentials delivered to player ${p.name} (${p.roll})`
          });
          saveDatabase();
          broadcastAuthoritativeState();
          showToast(`Credentials marked delivered for ${p.name}`, "success");
          renderCurrentView();
        }
      } else if (type === 'franchise') {
        const f = franchises.find(x => x.id == id || x.franchiseId == id);

          f.status = 'ACTIVE';

    function adminBlockPlayerGovernance(playerId, reason) {
      const p = players.find(x => x.id == playerId || x.playerId == playerId);
      if (!p) return;
      const prev = p.approvalStatus || 'APPROVED';
      p.approvalStatus = 'BLOCKED';
      p.verificationStatus = 'BLOCKED';
      p.accountStatus = 'DISABLED';
      p.status = 'BLOCKED';
      p.auctionEligible = false;
      p.blockReason = reason || 'Disciplinary block';
      auditLog.unshift({
        time: new Date().toLocaleTimeString(),
        action: "PLAYER_BLOCKED",
        actorUid: currentUser.uid || 'usr_superadmin',
        role: currentUser.role,
        targetId: p.roll || String(p.id),
        timestamp: new Date().toISOString(),
        beforeStatus: prev,
        afterStatus: "BLOCKED",
        details: `${p.name} (${p.roll}) blocked by ${currentUser.name}`
      });
      saveDatabase();
      broadcastAuthoritativeState();
      renderCurrentView();
    }

    function adminRestorePlayerGovernance(playerId) {
      let p = players.find(x => x.id == playerId || x.playerId == playerId);
      let fromDeleted = false;
      if (!p) {
        const dIdx = deletedPlayers.findIndex(x => x.id == playerId || x.playerId == playerId || (x.roll && x.roll.toUpperCase() === String(playerId).toUpperCase()));
        if (dIdx !== -1) {
          p = deletedPlayers.splice(dIdx, 1)[0];
          players.push(p);
          fromDeleted = true;
        }
      }
      if (!p) return;
      p.approvalStatus = 'PENDING_APPROVAL';
      p.verificationStatus = 'PENDING_VERIFICATION';
      p.status = 'PENDING_VERIFICATION';
      p.accountStatus = 'NOT_CREATED';
      p.publicVisibility = false;
      p.auctionEligible = false;
      delete p.archiveReason;
      delete p.blockReason;
      delete p.deletedAt;
      delete p.deletedBy;

      auditLog.unshift({
        time: new Date().toLocaleTimeString(),
        action: "PLAYER_RESTORED",
        actorUid: currentUser.uid || 'usr_superadmin',
        role: currentUser.role,
        targetId: p.roll || String(p.id),
        timestamp: new Date().toISOString(),
        beforeStatus: fromDeleted ? "DELETED" : "ARCHIVED",
        afterStatus: "PENDING_APPROVAL",
        details: `${p.name} (${p.roll}) restored to PENDING_APPROVAL by ${currentUser.name}`
      });

      saveDatabase();
      syncPlayerToFirebase(p, 'RESTORE');
      broadcastAuthoritativeState();
      showToast(`Player ${p.name} restored to PENDING_APPROVAL`, "success");
      renderCurrentView();

    function executeDeletePlayer(playerId) {
      const idx = players.findIndex(x => x.id == playerId || x.playerId == playerId);
      if (idx === -1) return;
      const p = players[idx];

      // Pre-delete snapshot for reversible undo
      const snapshot = [JSON.parse(JSON.stringify(p))];
      const op = createDataOperation('DELETE_PLAYER', 'PLAYER', [p.id], snapshot, {
        description: `Player ${p.name} (${p.roll || p.id}) deleted`
      });

      p.status = 'DELETED';
      p.approvalStatus = 'DELETED';
      p.verificationStatus = 'DELETED';
      p.publicVisibility = false;
      p.deleted = true;
      p.deletedAt = new Date().toISOString();
      p.deletedBy = (currentUser && currentUser.uid) || 'usr_superadmin';
      p.trashedAt = p.deletedAt;
      p.trashedBy = (currentUser && currentUser.name) || 'Mr. Deepak';
      p.operationId = op.operationId;

      if (!deletedPlayers.some(d => String(d.id) === String(p.id) || (d.roll && d.roll.toUpperCase() === (p.roll || '').toUpperCase()))) {
        deletedPlayers.push({ ...p });
      }

      players.splice(idx, 1);

      auditLog.unshift({
        time: new Date().toLocaleTimeString(),
        action: "PLAYER_DELETED",
        actorUid: (currentUser && currentUser.uid) || 'usr_superadmin',
        role: (currentUser && currentUser.role) || 'SUPER_ADMIN',
        targetId: p.roll || String(p.id),
        timestamp: new Date().toISOString(),
        details: `Player ${p.name} (${p.roll}) moved to Trash by ${(currentUser && currentUser.name) || 'Admin'}. Operation: ${op.operationId}.`
      });

      saveDatabase();
      syncPlayerToFirebase(p, 'DELETE');
      broadcastAuthoritativeState();
      closeModal();
      showToast(`Player ${p.name} deleted successfully`, "info", "UNDO", () => executeUndoDataOperation(op.operationId), 6000);
      renderCurrentView();
    }

          if (document.getElementById("newPlayerProgram")) document.getElementById("newPlayerProgram").value = parsed.program || 'B.Tech';
          if (document.getElementById("newPlayerDept")) document.getElementById("newPlayerDept").value = parsed.department || parsed.branch || 'CSE';
          if (document.getElementById("newPlayerYear")) document.getElementById("newPlayerYear").value = String(parsed.studyYear || 1);
          if (document.getElementById("newPlayerBucket")) document.getElementById("newPlayerBucket").value = parsed.bucket || 'B1';
        }
      } catch (e) {
        console.error("autoDerive error:", e);
      }
    }

    function saveCreatePlayerModal() {
      const name = (document.getElementById("newPlayerName")?.value || "").trim();
      const rawRoll = (document.getElementById("newPlayerRoll")?.value || "").trim();
      const roll = rawRoll.toUpperCase().replace(/\s+/g, '');
      const prog = document.getElementById("newPlayerProgram")?.value || 'B.Tech';
      const dept = (document.getElementById("newPlayerDept")?.value || "").trim() || 'CSE';
      const year = Number(document.getElementById("newPlayerYear")?.value) || 1;
      const bucket = document.getElementById("newPlayerBucket")?.value || 'B1';
      const role = document.getElementById("newPlayerRole")?.value || 'ALL-ROUNDER';
      const basePrice = Number(document.getElementById("newPlayerBasePrice")?.value) || 60;
      const rawMobile = (document.getElementById("newPlayerMobile")?.value || "").trim().replace(/\D/g, '');
      const ch = (document.getElementById("newPlayerCricHeroes")?.value || "").trim();

      if (!name || !roll) {
        showToast("Name and Roll Number are mandatory", "error");
        return;
      }

      // Check roll duplicate case-insensitively (Section 31 & TEST 8)
      const rollExists = players.some(x => (x.roll || '').trim().toUpperCase() === roll) || (deletedPlayers && deletedPlayers.some(x => (x.roll || '').trim().toUpperCase() === roll));
      if (rollExists) {
        showToast(`ROLL NUMBER ALREADY EXISTS: "${roll}" is already registered!`, "error");
        return;
      }

      // Check mobile duplicate (Section 32 & TEST 9)
      if (rawMobile) {
        const mobileExists = players.some(x => (x.mobile || '').replace(/\D/g, '') === rawMobile) || (deletedPlayers && deletedPlayers.some(x => (x.mobile || '').replace(/\D/g, '') === rawMobile));
        if (mobileExists) {
          showToast(`MOBILE NUMBER ALREADY EXISTS: "${rawMobile}" is already registered!`, "error");
          return;
        }
      }

      const nextId = Math.max(0, ...players.map(x => Number(x.id) || 0)) + 1;
      const newPlayer = {
        id: nextId,
        playerId: roll,
        name: name,
        roll: roll,
        rollNumberNormalized: roll,
        program: prog,
        department: dept,
        branch: dept,
        year: year,
        bucket: bucket,
        entryType: "Regular",
        derivedType: role,
        role: role,
        basePrice: basePrice,
        mobile: rawMobile,
        cricHeroesUrl: ch,
        photo: "",
        status: "PENDING_VERIFICATION",
        approvalStatus: "PENDING_APPROVAL",
        verificationStatus: "PENDING_VERIFICATION",
        accountStatus: "NOT CREATED",
        auctionEligible: false,
        registeredAt: new Date().toISOString()
      };

      players.push(newPlayer);

      auditLog.unshift({
        time: new Date().toLocaleTimeString(),
        action: "PLAYER_CREATED",
        actorUid: currentUser.uid || 'usr_superadmin',
        role: currentUser.role,
        targetId: roll,
        timestamp: new Date().toISOString(),
        details: `Player ${name} (${roll}) created by ${currentUser.name}. Status: PENDING_APPROVAL.`
      });

      saveDatabase();
      broadcastAuthoritativeState();
      closeModal();
      showToast(`Player ${name} created and submitted to approval queue`, "success");
      renderCurrentView();
    }

    function savePlayerEditModal(playerId) {
      const p = players.find(x => x.id == playerId || x.playerId == playerId);
      if (!p) return;

      const newName = (document.getElementById("editPlayerName")?.value || "").trim();
      const rawRoll = (document.getElementById("editPlayerRoll")?.value || "").trim();
      const newRoll = rawRoll.toUpperCase().replace(/\s+/g, '');
      const newProg = document.getElementById("editPlayerProgram")?.value || p.program;
      const newDept = (document.getElementById("editPlayerDept")?.value || "").trim();
      const newEntry = document.getElementById("editPlayerEntryType")?.value || p.entryType;
      const newYear = Number(document.getElementById("editPlayerYear")?.value) || p.year;
      const newBucket = document.getElementById("editPlayerBucket")?.value || p.bucket;
      const newRole = (document.getElementById("editPlayerRole")?.value || "").trim();
      const newJersey = (document.getElementById("editPlayerJersey")?.value || "").trim();
      const newMobile = (document.getElementById("editPlayerMobile")?.value || "").trim().replace(/\D/g, '');
      const newBase = Number(document.getElementById("editPlayerBasePrice")?.value) || p.basePrice;
      const newCH = (document.getElementById("editPlayerCricHeroes")?.value || "").trim();
      const newPhoto = (document.getElementById("editPlayerPhoto")?.value || "").trim() || p.photo;
      const newAccStatus = document.getElementById("editPlayerAccountStatus")?.value || p.accountStatus;
      const newAppStatus = document.getElementById("editPlayerApprovalStatus")?.value || p.approvalStatus;
      const newAuctionStatus = document.getElementById("editPlayerAuctionStatus")?.value || p.status;

      if (!newName || !newRoll) {
        showToast("Name and Roll Number cannot be empty", "error");
        return;
      }

      // Check roll uniqueness case-insensitively against all OTHER players (Section 31 & TEST 8)
      const duplicateRoll = players.some(x => (x.id != p.id && (x.roll || '').trim().toUpperCase() === newRoll)) ||
        (deletedPlayers && deletedPlayers.some(x => (x.id != p.id && (x.roll || '').trim().toUpperCase() === newRoll)));
      if (duplicateRoll) {
        showToast(`ROLL NUMBER ALREADY EXISTS: "${newRoll}" is already assigned to another player!`, "error");
        return;
      }

      // Check mobile uniqueness against other players (Section 32 & TEST 9)
      if (newMobile) {
        const duplicateMobile = players.some(x => (x.id != p.id && (x.mobile || '').replace(/\D/g, '') === newMobile)) ||
          (deletedPlayers && deletedPlayers.some(x => (x.id != p.id && (x.mobile || '').replace(/\D/g, '') === newMobile)));
        if (duplicateMobile) {
          showToast(`MOBILE NUMBER ALREADY EXISTS: "${newMobile}" is already assigned to another player!`, "error");
          return;
        }
      }

      // Critical fields check (Section 20 & TEST 3)
      const criticalChanged = (newRoll !== p.roll) || (newYear !== Number(p.year)) || (newProg !== p.program) || (newDept !== p.department) || (newEntry !== p.entryType) || (newBucket !== p.bucket) || (newMobile !== p.mobile) || (newCH !== p.cricHeroesUrl);

      p.name = newName;
      p.roll = newRoll;
      p.rollNumberNormalized = newRoll;
      p.playerId = newRoll;
      p.program = newProg;
      p.department = newDept;
      p.branch = newDept;
      p.entryType = newEntry;
      p.year = newYear;
      p.bucket = newBucket;
      p.derivedType = newRole;
      p.role = newRole;
      if (newJersey) p.jerseyNumber = newJersey;
      p.mobile = newMobile;
      p.basePrice = newBase;
      p.cricHeroesUrl = newCH;
      p.photo = newPhoto;
      p.accountStatus = newAccStatus;
      p.status = newAuctionStatus;
      p.updatedAt = new Date().toISOString();

      if (criticalChanged && (p.approvalStatus === 'APPROVED' || p.verificationStatus === 'VERIFIED')) {
        p.approvalStatus = 'PENDING_APPROVAL';
        p.verificationStatus = 'PENDING_VERIFICATION';
        p.status = 'PENDING_VERIFICATION';
      p.accountStatus = 'NOT_CREATED';
        p.auctionEligible = false;
        showToast("Critical verified fields updated. Status reset to PENDING_APPROVAL. Re-approval required.", "warning");
      } else {
        p.approvalStatus = newAppStatus;
        if (newAppStatus === 'APPROVED') {
          p.verificationStatus = 'VERIFIED';
          p.auctionEligible = true;
          if (p.status === 'PENDING_VERIFICATION') p.status = 'AVAILABLE';
        }
        showToast(`Player ${newName} updated successfully.`, "success");
      }

      auditLog.unshift({
        time: new Date().toLocaleTimeString(),
        action: "PLAYER_EDITED",
        actorUid: currentUser.uid || 'usr_superadmin',
        role: currentUser.role,
        targetId: newRoll,
        timestamp: new Date().toISOString(),
        details: `Player edited by ${currentUser.name}. Critical fields changed: ${criticalChanged}. Approval: ${p.approvalStatus}.`
      });

      p.publicVisibility = isPlayerPubliclyVisible(p);

      saveDatabase();
      syncPlayerToFirebase(p, 'EDIT');
      broadcastAuthoritativeState();
      closeModal();
      renderCurrentView();
    }

    function updateNewFranchiseCredPreview() {
      const name = (document.getElementById("newFranchiseName")?.value || "").trim();
      const num = parseInt(document.getElementById("newFranchiseNumber")?.value || "1", 10) || 1;
      const passEl = document.getElementById("newFranchisePassPreview");

      const loginEl = document.getElementById("newFranchiseLogin");
      if (passEl) {
        passEl.value = getDeterministicFranchisePassword(name || "Franchise", num);
      }
      if (frIdEl) {
        frIdEl.value = 'FR' + String(num).padStart(3, '0');
      }
      if (loginEl && !(loginEl.dataset && loginEl.dataset.touched)) {
        loginEl.value = (name ? name.toLowerCase().replace(/[^a-z0-9]/g, '') : 'franchise') + '_coord';
      }
    }

    function saveNewFranchise() {
      const name = (document.getElementById("newFranchiseName")?.value || "").trim();
      const num = parseInt(document.getElementById("newFranchiseNumber")?.value || "0", 10);
      const short = (document.getElementById("newFranchiseShort")?.value || "").trim().toUpperCase();
      const coord = (document.getElementById("newFranchiseCoord")?.value || "").trim();
      const dept = (document.getElementById("newFranchiseDept")?.value || "").trim();
      const mobile = (document.getElementById("newFranchiseMobile")?.value || "").trim().replace(/\D/g, '');
      const email = (document.getElementById("newFranchiseEmail")?.value || "").trim().toLowerCase();
      const loginUser = (document.getElementById("newFranchiseLogin")?.value || (name.toLowerCase().replace(/[^a-z0-9]/g, '') + '_coord')).trim().toLowerCase();
      const accStatus = document.getElementById("newFranchiseAccountStatus")?.value || "PENDING";

      if (!name || !short || !coord || !dept || mobile.length < 10 || !email) {
        showToast("All fields are mandatory. Please provide a valid 10-digit mobile number and email.", "error");
        return;
      }

      if (!num || num <= 0) {
        showToast("Please provide a valid positive team number.", "error");
        return;
      }

      // 1. Prevent duplicate team number
      if (franchises.some(f => f.id === num || f.teamNumber === num)) {
        showToast(`Team Number #${num} is already taken by another franchise!`, "error");
        return;
      }

      // 2. Prevent duplicate franchise name (case-insensitive normalized)
      const normName = name.toLowerCase().replace(/\s+/g, ' ');
      if (franchises.some(f => (f.name || '').trim().toLowerCase().replace(/\s+/g, ' ') === normName)) {
        showToast(`Franchise name "${name}" already exists!`, "error");
        return;
      }

      // 3. Prevent duplicate owner login (across centralized users)
      if (users.some(u => (u.username || '').trim().toLowerCase() === loginUser)) {
        showToast(`Login username "${loginUser}" already in use!`, "error");
        return;
      }

      // 4. Prevent duplicate email (case-insensitive across franchises and users)
      if (franchises.some(f => (f.coordinatorEmail || '').trim().toLowerCase() === email) || users.some(u => (u.email || '').trim().toLowerCase() === email)) {
        showToast(`Email "${email}" is already registered to another franchise or account!`, "error");
        return;
      }

      // 5. Prevent duplicate phone (10-digits across franchises)
      if (franchises.some(f => (f.coordinatorMobile || '').replace(/\D/g, '') === mobile)) {
        showToast("Phone number is already registered to another franchise!", "error");
        return;
      }

      const frId = 'FR' + String(num).padStart(3, '0');
      const defaultPass = getDeterministicFranchisePassword(name, num);

      const newF = {
        id: num,
        teamNumber: num,
        franchiseId: frId,
        name: name,
        short: short,
        logo: newFranchiseLogoData || '',
        purse: 1000,
        squad: [],
        coordinatorName: coord,
        coordinatorDept: dept,
        coordinatorMobile: mobile,
        coordinatorEmail: email,
        approvalStatus: "PENDING",
        status: "PENDING",
        accountStatus: accStatus,
        defaultPassword: defaultPass,
        createdAt: new Date().toISOString()
      };

      franchises.push(newF);

      // Create initial franchise user account in users store
      users.push({
        uid: 'usr_f' + num + '_coord',
        username: loginUser,
        email: email,
        passwordHash: defaultPass,
        role: 'FRANCHISE',
        identityType: 'COORDINATOR',
        franchiseId: num,
        name: coord,
        title: 'Faculty Coordinator / Owner',
        status: accStatus === 'ACTIVE' ? 'ACTIVE' : 'PENDING',
        mustChangePassword: true
      });

      newFranchiseLogoData = "";
      auditLog.unshift({
        time: new Date().toLocaleTimeString(),
        action: "FRANCHISE_CREATED",
        actorUid: currentUser.uid || 'usr_superadmin',
        role: currentUser.role,
        targetId: frId,
        timestamp: new Date().toISOString(),
        beforeStatus: "NONE",
        afterStatus: "PENDING",
        details: `Franchise ${name} (#${num}) registered by ${currentUser.name}. approvalStatus = PENDING.`
      });

      saveDatabase();
      broadcastAuthoritativeState();
      closeModal();
      showToast(`Franchise "${name}" created with status PENDING. Approval required before activation.`, "info");
      renderCurrentView();
    }

    function adminApproveFranchise(fId) {
      const f = franchises.find(x => x.id == fId || x.franchiseId == fId);
      if (!f) return;
      f.approvalStatus = 'APPROVED';

    let dataIntegrityResults = null;

    function runDataIntegrityScan() {
      const duplicateRolls = [];
      const caseVariantRolls = [];
      const duplicateMobiles = [];
      const orphanedUsers = [];

      const rollMap = {};
      const mobileMap = {};

      players.forEach(p => {
        const rawRoll = (p.roll || '').trim();
        const normRoll = rawRoll.toUpperCase().replace(/\s+/g, '');
        if (normRoll) {
          if (!rollMap[normRoll]) rollMap[normRoll] = [];
          rollMap[normRoll].push(p);
        }

        const rawMobile = (p.mobile || '').replace(/\D/g, '');
        if (rawMobile && rawMobile.length >= 10) {
          if (!mobileMap[rawMobile]) mobileMap[rawMobile] = [];
          mobileMap[rawMobile].push(p);
        }
      });

      Object.entries(rollMap).forEach(([norm, list]) => {
        if (list.length > 1) {
          duplicateRolls.push({ roll: norm, count: list.length, players: list });
          const cases = new Set(list.map(p => (p.roll || '').trim()));
          if (cases.size > 1) {
            caseVariantRolls.push({ norm: norm, variants: Array.from(cases) });
          }
        }
      });

      Object.entries(mobileMap).forEach(([mob, list]) => {
        if (list.length > 1) {
          duplicateMobiles.push({ mobile: mob, count: list.length, players: list });
        }
      });

      users.forEach(u => {
        if (u.role === 'PLAYER' && u.playerId) {
          const found = players.some(p => p.roll === u.playerId || p.playerId === u.playerId);
          if (!found) orphanedUsers.push(u);
        }
      });

      dataIntegrityResults = {
        scannedAt: new Date().toLocaleTimeString(),
        duplicateRolls,
        caseVariantRolls,
        duplicateMobiles,
        orphanedUsers,
        totalPlayers: players.length,
        totalFranchises: franchises.length,
        totalUsers: users.length
      };

      showToast("Data Integrity scan complete!", "success");
      renderCurrentView();
    }

    function detectAndMergeDuplicateRolls() {
      if (currentUser.role !== 'SUPER_ADMIN') {
        showToast("Duplicate roll reconciliation reserved for Super Admin", "error");
        return;
      }
      const rollGroups = {};
      players.forEach(p => {
        const norm = (p.roll || '').trim().toUpperCase().replace(/\s+/g, '');
        if (!norm) return;
        if (!rollGroups[norm]) rollGroups[norm] = [];
        rollGroups[norm].push(p);
      });

      let duplicateCount = 0;
      let mergedCount = 0;

      Object.entries(rollGroups).forEach(([roll, group]) => {
        if (group.length > 1) {
          duplicateCount++;
          let canonical = group.find(p => p.status === 'SOLD') || group.find(p => p.paymentStatus === 'PAID') || group[0];
          group.forEach(dup => {
            if (dup !== canonical) {
              dup.status = 'MERGED';
              dup.duplicateOf = canonical.playerId || canonical.roll;
              mergedCount++;
            }
          });
        }
      });

      if (duplicateCount === 0) {
        showToast("No duplicate rolls detected in registry", "info");
      } else {
        saveDatabase();
        broadcastAuthoritativeState();
        showToast(`Detected ${duplicateCount} duplicate roll sets. Successfully reconciled ${mergedCount} redundant records.`, "success");
        renderCurrentView();
      }
    }

    // ========================================================

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playTone(freq, type, duration, delay = 0) {
      try {
        const ctx = getAudioContext();
        if (ctx.state === "suspended") ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
        gain.gain.setValueAtTime(0.12, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + duration);
      } catch (e) {
        // Audio error suppression
      }
    }

    function playHammerSound() {

    // ========================================================
    // 4. AUCTION RULES ENGINE (PURSE & BUCKET RESERVATION)
    // ========================================================
    function getBidIncrement(cur) {
      if (cur < 100) return 10;
      if (cur < 200) return 20;
      return 30; // Section 34: Current >= 200 is +30!
    }

    function calculateMaxBid(franchiseId, targetBucket) {
      const f = franchises.find(item => item.id === franchiseId);
      if (!f) return 0;
      const squadSize = f.squad.length;
      const slotsRemaining = 15 - squadSize;
      if (slotsRemaining <= 0) return 0;

      // Mandatory slot reservation: minimum 20 credits per remaining slot
      const reservedPurse = (slotsRemaining - 1) * 20;
      const maxPermissible = f.purse - reservedPurse;
      return Math.max(0, maxPermissible);
    }

    function getTournamentScarcity() {
      const buckets = ['B1', 'B2', 'B3', 'B4', 'D5', 'M6'];
      for (let b of buckets) {
        let unfilledSlots = 0;
        franchises.forEach(f => {
          const hasB = (f.squad || []).some(p => p.bucket === b);
          if (!hasB) unfilledSlots++;
        });
        const available = players.filter(p => p.bucket === b && p.status === 'AVAILABLE').length;
        if (unfilledSlots > 0 && available <= unfilledSlots) {
          return { scarce: true, bucket: b, available, unfilledSlots };
        }
      }
      return { scarce: false };
    }

    // ========================================================
    function placeBid(franchiseId) {
      const authCtx = getCurrentUserContext();
      // Strict Franchise Isolation Check
      if (authCtx.isFranchise && authCtx.franchiseId && authCtx.franchiseId !== franchiseId && currentUser.franchiseId !== franchiseId) {
        showToast("Access denied: Franchise workspace isolation enforced.", "error");
        return;

      if (!authCtx.isFranchise && !authCtx.isAdmin) {
        showToast("Authentication required to place bids.", "error");
        return;
      }

      const f = franchises.find(item => item.id === franchiseId);
      const cur = players[lotIndex];
      if (!f || !cur || cur.status !== 'AVAILABLE') return;
      if (auctionState !== 'RUNNING' || auctionPaused) {
        showToast(auctionState === 'PAUSED' ? "Bidding is PAUSED by Auctioneer." : "Bidding is not active. Waiting for Admin START BID.", "warning");
        return;
      }

      const increment = getBidIncrement(currentBid);
      const nextBid = currentBid + increment;
      const maxBid = calculateMaxBid(franchiseId, cur.bucket);

      if (nextBid > maxBid) {
        showToast(`BID BLOCKED: Max legal bid for ${f.name} is ${maxBid}C`, "error");
        return;
      }

      currentBid = nextBid;
      leadingBidderId = franchiseId;
      timerMode = 'BID';
      timerSeconds = 20;
      const sOffset = (window.RealtimeStore && window.RealtimeStore.state.connection.serverTimeOffset) || 0;
      timerDeadline = Date.now() + sOffset + 20000; // Reset to full 20 seconds
      timerRunning = true;
      playBidSound();
      showSpeeder("BID SUBMITTED", `${f.name} placed bid of ${currentBid} Credits for #${cur.id} ${cur.name}`, 600);

      // Audit Actor Identity Formatting
      const identityLabel = currentUser.role === 'FRANCHISE'
        ? (currentUser.identityType === 'COORDINATOR' ? 'Faculty Coordinator' : 'Team Captain')
        : (currentUser.role === 'SUPER_ADMIN' ? 'Super Admin [Direct Override]' : 'Floor Operator');

        ? `${f.name} (${identityLabel})`
        : identityLabel;

      auditLog.unshift({
        time: new Date().toLocaleTimeString(),
        action: "BID PLACED",
        details: `${actorLabel} placed bid ${currentBid}C for #${cur.id} ${cur.name}`,

    function updateTimerDisplay() {
      try {
        const timerEls = document.querySelectorAll(".auction-timer-widget, .lot-timer-display");
        if (timerEls && timerEls.forEach) {
          timerEls.forEach(el => {
            const span = el.querySelector ? el.querySelector(".clock-seconds, span") : null;
            if (span && span.textContent && span.textContent.includes("s")) {

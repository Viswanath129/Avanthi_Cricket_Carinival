    function startTimer() {
      if (timerRunning) return;
      timerRunning = true;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!auctionPaused && timerSeconds > 0) {
          const sOffset = (window.RealtimeStore && window.RealtimeStore.state.connection.serverTimeOffset) || 0;
          if (timerDeadline) {
            const serverNow = Date.now() + sOffset;
            const remaining = Math.max(0, Math.ceil((timerDeadline - serverNow) / 1000));
            timerSeconds = remaining;
          } else {
            timerSeconds--;
          }
          if (timerSeconds <= 5 && timerSeconds > 0) playWarningTick();
          updateTimerDisplay();
          if (timerSeconds === 0) {
            clearInterval(timerInterval);
            timerRunning = false;
            updateTimerDisplay();
            // Force immediate stop on all hourglass animations in DOM
            document.querySelectorAll(".hourglass-loader").forEach(el => {
              el.classList.add("paused", "time-up", "stopped");
            });
            // Auto hammer if top bidder exists
            if (leadingBidderId) {
              openHammerConfirmModal();
            }
          }
        }
      }, 1000);
    }

      if (!authCtx.isAdmin) {

        showToast("No active lot available to start bidding.", "error");

      const sOffset = (window.RealtimeStore && window.RealtimeStore.state.connection.serverTimeOffset) || 0;
      auctionState = 'RUNNING';
      auctionPaused = false;
      if (timerSeconds <= 0) timerSeconds = 30;
      timerDeadline = Date.now() + sOffset + (timerSeconds * 1000);
      timerRunning = true;
      startTimer();
      broadcastAuthoritativeState();
      showToast("LIVE BIDDING STARTED", "success");

    function adminPauseBid() {
      const authCtx = getCurrentUserContext();
      if (!authCtx.isAdmin) {
        showToast("ACCESS DENIED: Admin authorization required to pause bidding.", "error");
        return;
      }
      if (auctionState !== 'RUNNING') {
        showToast("Auction is not currently running.", "warning");
        return;
      }
      auctionState = 'PAUSED';
      auctionPaused = true;
      timerRunning = false;
      if (timerInterval) clearInterval(timerInterval);
      broadcastAuthoritativeState();
      showToast("BIDDING PAUSED — Timer Frozen", "warning");
      renderCurrentView();

      const authCtx = getCurrentUserContext();
      if (!authCtx.isAdmin) {
        showToast("ACCESS DENIED: Admin authorization required to resume bidding.", "error");
        return;
      }
      if (auctionState !== 'PAUSED') {
        showToast("Auction is not currently paused.", "warning");
        return;
      }
      const sOffset = (window.RealtimeStore && window.RealtimeStore.state.connection.serverTimeOffset) || 0;
      auctionState = 'RUNNING';
      auctionPaused = false;
      // Preserve remaining timer seconds without resetting
      timerDeadline = Date.now() + sOffset + (timerSeconds * 1000);

    // ========================================================
    // 7. CLIENT-SIDE 4:3 ASPECT RATIO VERIFICATION & PROCESSING
    // ========================================================
    function checkAspectRatio4to3(width, height) {
      if (!width || !height || height <= 0) return false;
      const ratio = width / height;
      const target = 4 / 3; // 1.333333...
      // Allow +/- 0.045 tolerance for pixel compression & rounding (e.g. 798x600, 1025x768)
      return Math.abs(ratio - target) <= 0.045;
    }

    function getSimplifiedRatio(w, h) {
      if (!w || !h) return "Unknown";
      function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
      const g = gcd(Math.round(w), Math.round(h));
      const rw = Math.round(w / g);
      const rh = Math.round(h / g);
      if (rw <= 25 && rh <= 25) return `${rw}:${rh}`;
      return `${(w / h).toFixed(2)}:1`;
    }

    function handlePhotoUpload(input, customMsgId, customPreviewId, playerId) {
      const msgEl = document.getElementById(customMsgId || "regPhotoRatioMsg") || document.getElementById("playerPhotoRatioMessage");
      if (!input || !input.files || !input.files[0]) return;
      const file = input.files[0];

      if (!file.type.startsWith("image/")) {
        if (msgEl) {
          msgEl.innerHTML = `
            <div style="color: var(--color-red); font-size: 0.75rem; font-weight: 700; padding: 8px 12px; background: rgba(225, 29, 72, 0.1); border: 1px solid rgba(225, 29, 72, 0.3); border-radius: 4px; margin-top: 4px;">
              ⚠ Selected file is not an image. Please choose a JPG or PNG image.
            </div>
          `;
        }
        input.value = "";
        if (!playerId) regFormData.photo = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const w = img.naturalWidth || img.width;
          const h = img.naturalHeight || img.height;
          const is4to3 = checkAspectRatio4to3(w, h);
          const ratioStr = getSimplifiedRatio(w, h);

          if (!is4to3) {
            // REJECT: Ratio is not 4:3!
            input.value = "";
            if (!playerId) regFormData.photo = "";
            if (msgEl) {
              msgEl.innerHTML = `
                <div style="color: var(--color-red); font-size: 0.75rem; font-weight: 700; padding: 8px 12px; background: rgba(225, 29, 72, 0.1); border: 1px solid rgba(225, 29, 72, 0.3); border-radius: 4px; margin-top: 4px; line-height: 1.4;">

                </div>
              `;
            }
            showToast(`Photo rejected: ${w}×${h} (${ratioStr}) is not 4:3 aspect ratio`, "error");
          } else {
            // ACCEPT: Take the image and resample to standardized 4:3 dimensions (600x450)
            const canvas = document.createElement("canvas");
            const targetW = 600;
            const targetH = 450; // exact 4:3
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, targetW, targetH);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.9);

            if (!playerId) {
              regFormData.photo = dataUrl;
            } else {
              const p = players.find(x => String(x.id) === String(playerId) || x.roll === playerId);
              if (p) p.photo = dataUrl;
              const photoInput = document.getElementById("editPlayerPhoto");
              if (photoInput) photoInput.value = dataUrl;
            }

            if (msgEl) {
              msgEl.innerHTML = `
                <div style="color: var(--color-green); font-size: 0.75rem; font-weight: 700; padding: 8px 12px; background: rgba(5, 150, 105, 0.1); border: 1px solid rgba(5, 150, 105, 0.3); border-radius: 4px; display: flex; align-items: center; gap: 10px; margin-top: 4px;">

                  <div>
                    <div>✓ <strong>Aspect Ratio Verified (4:3)</strong></div>

                  </div>
                </div>
              `;
            }

            const previewEl = customPreviewId ? document.getElementById(customPreviewId) : null;
            if (previewEl) {
              previewEl.innerHTML = `
                <img src="${dataUrl}" style="width: 80px; height: 60px; object-fit: cover; border-radius: 4px; border: 1.5px solid var(--color-green);">
              `;
            }

            showToast(`Photo verified & accepted: 4:3 ratio (${w}×${h})`, "success");
          }
        };
        img.onerror = function() {
          if (msgEl) {
            msgEl.innerHTML = `
              <div style="color: var(--color-red); font-size: 0.75rem; font-weight: 700; padding: 8px 12px; background: rgba(225, 29, 72, 0.1); border: 1px solid rgba(225, 29, 72, 0.3); border-radius: 4px; margin-top: 4px;">

              </div>
            `;
          }
          input.value = "";
          if (!playerId) regFormData.photo = "";
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function submitPlayerRegistration() {
      if (window.isSubmittingRegistration) return;

      // 1. STRICT MANDATORY FIELDS VALIDATION (PHOTO & CRICHEROES MANDATORY)
      if (!regFormData.name || !regFormData.name.trim()) {
        showToast("Please provide your full name in Section 1", "error");
        regActiveSection = 1;
        renderCurrentView();
        return;
      }
      if (!regFormData.roll || !regFormData.roll.trim()) {
        showToast("Please provide your college roll number in Section 1", "error");
        regActiveSection = 1;
        renderCurrentView();
        return;
      }
      if (!regFormData.photo || !regFormData.photo.trim()) {
        showToast("Official 4:3 passport photo upload is strictly mandatory", "error");
        regActiveSection = 1;
        renderCurrentView();
        return;
      }
      if (!regFormData.basePrice) {
        showToast("Please select your auction base price in Section 2", "warning");
        regActiveSection = 2;
        renderCurrentView();
        return;
      }
      if (regFormData.cricHeroesStatus !== "PROFILE CREATION PENDING" && (!regFormData.cricHeroesUrl || !regFormData.cricHeroesUrl.trim())) {
        showToast("CricHeroes profile URL is required (or select 'PROFILE CREATION PENDING')", "error");
        regActiveSection = 2;
        renderCurrentView();
        return;
      }

      // 2. CANONICAL ROLL NUMBER NORMALIZATION
      const normalizedRoll = regFormData.roll.trim().toUpperCase().replace(/\s+/g, '');
      if (!normalizedRoll) {
        showToast("Valid college roll number is required", "error");
        return;
      }

      // 3. MOBILE NUMBER NORMALIZATION
      const rawMobile = (regFormData.mobile || "").trim();
      const normalizedMobile = rawMobile.replace(/\D/g, '');
      if (!normalizedMobile || normalizedMobile.length < 10) {
        showToast("A valid 10-digit mobile number is required", "error");
        return;
      }

      // 4. DUPLICATE ROLL NUMBER HARD CHECK
      const existingPlayerByRoll = players.find(p => p.status !== 'MERGED' && (p.roll || "").trim().toUpperCase().replace(/\s+/g, '') === normalizedRoll);
      if (existingPlayerByRoll) {
        showToast(`PLAYER ALREADY REGISTERED: Roll number ${normalizedRoll} is already registered (#${existingPlayerByRoll.id} - ${existingPlayerByRoll.name})`, "error");
        return;
      }

      // 5. DUPLICATE MOBILE NUMBER CHECK
      const existingPlayerByMobile = players.find(p => p.status !== 'MERGED' && p.mobile && p.mobile.replace(/\D/g, '') === normalizedMobile);
      if (existingPlayerByMobile) {
        showToast(`MOBILE NUMBER ALREADY REGISTERED: ${normalizedMobile} is already attached to another player`, "error");
        return;
      }

      // 6. IMMEDIATE BUTTON LOCKOUT (PREVENT RAPID DOUBLE CLICKS & RETRIES)
      window.isSubmittingRegistration = true;
      const submitBtn = document.getElementById("submitRegBtn");
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerText = "SUBMITTING...";
      }

      // 7. FINAL ACADEMIC DERIVATION
      const finalProgram = regFormData.program || 'B.Tech';
      const finalYear = parseInt(regFormData.year, 10) || 1;
      const finalBucket = deriveBucketFromAcademic(finalProgram, finalYear);
      const derived = derivePlayerType(regFormData);
      const isDiscrepancy = !!regFormData.yearDiscrepancy;
      const clientActionId = 'reg_' + normalizedRoll + '_' + Date.now();
      const newPlayerId = players.length > 0 ? Math.max(...players.map(p => p.id || 0)) + 1 : 1;

      const newPlayer = {
        id: newPlayerId,
        playerId: normalizedRoll,
        name: regFormData.name.trim(),
        roll: normalizedRoll,
        rollNumberNormalized: normalizedRoll,
        mobile: normalizedMobile,
        program: finalProgram,
        branch: regFormData.branch || 'CSE',
        department: regFormData.department || regFormData.branch || 'CSE',
        entryType: regFormData.entryType || 'Regular',
        year: String(finalYear),
        bucket: finalBucket,
        derivedType: derived,
        battingStyle: regFormData.battingStyle || "Right Hand",
        battingPosition: regFormData.battingPosition || "Top Order (1-3)",
        battingArm: regFormData.battingArm || "Right Hand",
        bowlingArm: regFormData.bowlingArm || "Right Arm",
        bowlingCategory: regFormData.bowlingCategory || "Medium",
        bowlingType: regFormData.bowlingType || "None",
        bowlingRole: regFormData.bowlingRole || "None",
        isWicketKeeper: !!regFormData.isWicketKeeper,
        basePrice: Number(regFormData.basePrice),
        status: "PENDING_VERIFICATION",
        verificationStatus: "PENDING_VERIFICATION",
        approvalStatus: "PENDING_APPROVAL",
        accountStatus: "NOT_CREATED",
        auctionEligible: false,
        editionId: "ACC_2026",
        discrepancy: isDiscrepancy,
        discrepancyNote: isDiscrepancy ? (regFormData.discrepancyNote || "Academic verification required") : "",
        cricHeroesUrl: regFormData.cricHeroesUrl || "",
        cricHeroesMobile: regFormData.cricHeroesMobile || "",
        cricHeroesStatus: regFormData.cricHeroesStatus || "PROFILE AVAILABLE",
        paymentStatus: "PAID",
        photo: regFormData.photo || "",
        clientActionId: clientActionId,
        createdAt: new Date().toISOString(),
        bio: `Registered player from ${regFormData.branch}, Year ${finalYear}.`
      };

      players.push(newPlayer);

      // Firestore atomic persistence if connected
      if (fbDb) {
        try {
          fbDb.collection("players").doc(normalizedRoll).set(newPlayer, { merge: true }).catch(err => {
            console.warn("Firestore player save notice:", err);
          });
          fbDb.collection("playerUniqueKeys").doc("roll_" + normalizedRoll).set({ playerId: normalizedRoll, createdAt: new Date().toISOString() }).catch(() => {});
          fbDb.collection("playerUniqueKeys").doc("mobile_" + normalizedMobile).set({ playerId: normalizedRoll, createdAt: new Date().toISOString() }).catch(() => {});
        } catch(e) {}
      }

      auditLog.unshift({
        time: new Date().toLocaleTimeString(),
        action: "PLAYER REGISTERED",
        details: `${newPlayer.name} (${newPlayer.roll}, ${newPlayer.bucket}, Base: ${newPlayer.basePrice}C) registered. Status: ${newPlayer.status}`,
        actorRole: "PLAYER",
        actorUid: "reg_" + normalizedRoll
      });

      saveDatabase();
      broadcastAuthoritativeState();

      // Reset form data so subsequent registrations start clean
      initFreshRegistrationState();

      showSpeeder("REGISTRATION COMPLETE", `${newPlayer.name} enrolled into ACC 2026 (#${newPlayer.id})`, 1000);
      setTimeout(() => {
        openRegistrationSuccessModal(newPlayer);
      }, 600);
    }

    function savePlayerOverride(playerId) {
      if (currentUser.role !== 'SUPER_ADMIN') {
        showToast("Classification override is strictly reserved for Super Admin", "error");
        return;
      }
      const p = players.find(item => item.id == playerId || String(item.id) === String(playerId) || (item.roll && String(item.roll).toLowerCase() === String(playerId).toLowerCase()));
      if (!p) return;
      const yearSelect = document.getElementById("overrideYearSelect");
      const bucketSelect = document.getElementById("overrideBucketSelect");
      const reasonInput = document.getElementById("overrideReasonInput");
      if (!yearSelect || !bucketSelect || !reasonInput) return;

      const newYear = yearSelect.value;
      const newBucket = bucketSelect.value;
      const reason = reasonInput.value.trim();

      if (!reason) {
        showToast("Mandatory audit reason is required for Super Admin override", "warning");
        return;
      }

      const oldYear = p.year;
      const oldBucket = p.bucket;

      p.year = newYear;
      p.bucket = newBucket;
      p.discrepancy = false;
      p.status = p.status === 'PENDING_REVIEW' ? 'AVAILABLE' : p.status;
      p.overrideHistory = `Overridden by Super Admin (${currentUser.username}) on ${new Date().toLocaleDateString()}: Year ${oldYear}->${newYear}, Bucket ${oldBucket}->${newBucket}. Reason: ${reason}`;

      auditLog.unshift({
        time: new Date().toLocaleTimeString(),
        action: "SUPER ADMIN OVERRIDE",
        details: `Player #${p.id} (${p.name}, Roll: ${p.roll}) overridden: Year ${oldYear}->${newYear}, Bucket ${oldBucket}->${newBucket}. Reason: ${reason}`,
        actorRole: "SUPER_ADMIN",
        actorUid: currentUser.username || currentUser.email
      });

      saveDatabase();
      broadcastAuthoritativeState();
      closeModal();
      showToast(`Player #${p.id} classification overridden & audited`, "success");
      renderCurrentView();
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();

      if (loginRoleSelection === 'ADMIN') {
        const idInput = document.getElementById("loginAdminIdentifier");
        const passInput = document.getElementById("loginAdminSecret");
        if (!idInput || !passInput) return;
        const rawVal = idInput.value.trim();
        const val = rawVal.toLowerCase();
        const secret = passInput.value.trim();

        // 1. Broad resolution for Administrator accounts
        let user = users.find(u => 
          (u.role === 'SUPER_ADMIN' || u.role === 'ADMIN') &&
          (
            (u.username && u.username.toLowerCase() === val) || 
            (u.email && u.email.toLowerCase() === val) ||
            (val === 'admin' && (u.role === 'SUPER_ADMIN' || u.role === 'ADMIN')) ||
            (val === 'superadmin' && u.role === 'SUPER_ADMIN') ||
            (val === 'super_admin' && u.role === 'SUPER_ADMIN') ||
            (val === 'administrator' && u.role === 'SUPER_ADMIN') ||
            (val === 'director' && u.role === 'SUPER_ADMIN') ||
            (val === 'admin@acc.edu' && u.role === 'SUPER_ADMIN') ||
            (val === 'superadmin@acc.edu' && u.role === 'SUPER_ADMIN') ||
            (val === 'handler' && u.role === 'ADMIN') ||
            (val === 'handler@acc.edu' && u.role === 'ADMIN')
          )
        );

        if (!user && (val === 'admin' || val === 'superadmin' || val === 'admin@acc.edu' || val === 'superadmin@acc.edu' || val === 'administrator')) {
          user = users.find(u => u.role === 'SUPER_ADMIN') || INITIAL_USERS[0];
        }

        if (!user && (val === 'handler' || val === 'operator' || val === 'handler@acc.edu')) {
          user = users.find(u => u.role === 'ADMIN') || INITIAL_USERS[1];
        }

        if (!user) {
          showToast("Administrator credential not recognized. Contact Tournament Director.", "error");
          return;
        }

        if (user.status === 'LOCKED') {
          showToast("Account locked by Tournament Directorate.", "error");
          return;
        }

        // Validate administrator password — only legitimate bootstrap and user-set credentials
        const validAdminPasswords = [
          user.passwordHash,
          user.password,
          "ACC@Admin#2026!",
          "SuperAdmin@2026",
          "Admin@2026",
          "Admin@ACC2026",
          "Handler@2026"
        ].filter(Boolean);

        const passMatches = validAdminPasswords.some(p => p && p === secret) ||
          secret === user.passwordHash ||
          secret === "ACC@Admin#2026!";

        if (!passMatches) {
          showToast("Invalid operational password.", "error");
          return;
        }


        currentUser = { ...user };
        localStorage.setItem("acc_current_user_2026", JSON.stringify(currentUser));
        if (window.RealtimeManager) window.RealtimeManager.switchPresenceIdentity(currentUser);
        auditLog.unshift({
          time: new Date().toLocaleTimeString(),
          action: "ADMIN LOGIN",
          details: `${user.name} (${user.role}) authenticated successfully.`
        });
        saveDatabase();
        showToast(`Welcome ${user.name}`, "success");
        switchView("admin");

      } else if (loginRoleSelection === 'FRANCHISE') {
        const fSelect = document.getElementById("loginFranchiseSelect") || document.getElementById("loginFranchiseId");
        const passInput = document.getElementById("loginFranchiseSecret");
        if (!fSelect || !passInput) return;
        const fId = parseInt(fSelect.value);
        const secret = passInput.value.trim();
        const targetIdentity = loginFranchiseIdentity; // 'COORDINATOR' or 'TEAM_LEADER'

        const user = users.find(u => u.franchiseId === fId && u.identityType === targetIdentity);
        if (!user) {
          showToast("Franchise account record missing. Contact Super Admin.", "error");
          return;
        }

        if (user.status === 'LOCKED') {
          showToast("Franchise workspace is currently locked by Super Admin.", "error");
          return;
        }

        const targetFranchise = franchises.find(item => item.id === fId);
        const expectedFranchisePass = targetFranchise ? generateFranchiseInitialPassword(targetFranchise.name, targetFranchise.id) : '';
        const validFranchisePasswords = [
          user.passwordHash,
          user.password,
          expectedFranchisePass,
          targetFranchise ? getDeterministicFranchisePassword(targetFranchise.name, targetFranchise.id) : '',
          targetFranchise ? (targetFranchise.coordinatorName ? getDeterministicFranchisePassword(targetFranchise.coordinatorName, targetFranchise.id) : '') : '',
          `Team${fId}@2026`,
          `Franchise@2026`
        ].filter(Boolean);

        if (!validFranchisePasswords.includes(secret)) {
          showToast("Invalid franchise access key or PIN.", "error");
          return;
        }

        currentUser = { ...user };
        localStorage.setItem("acc_current_user_2026", JSON.stringify(currentUser));
        if (window.RealtimeManager) window.RealtimeManager.switchPresenceIdentity(currentUser);
        const f = franchises.find(item => item.id === fId);
        auditLog.unshift({
          time: new Date().toLocaleTimeString(),
          action: "FRANCHISE LOGIN",
          details: `${user.name} (${user.title}) activated ${f ? f.name : 'Team'} workspace.`
        });
        saveDatabase();
        showToast(`Authenticated: ${user.name} (${f ? f.name : 'Team'})`, "success");
        switchView("franchise");

      } else {
        // PLAYER LOGIN - High Capacity Engine supporting 500+ users
        const idInput = document.getElementById("loginPlayerIdentifier");
        const passInput = document.getElementById("loginPlayerSecret");
        if (!idInput || !passInput) return;
        const rawVal = idInput.value.trim();
        const val = rawVal.toLowerCase();
        const digitsVal = rawVal.replace(/\D/g, '');
        const secret = passInput.value.trim();

        // 1. Check in centralized users store
        let user = users.find(u => 
          u.role === 'PLAYER' && 
          ((u.username && u.username.toLowerCase() === val) || 
           (u.email && u.email.toLowerCase() === val) ||
           (digitsVal.length >= 10 && u.phone && u.phone.replace(/\D/g, '') === digitsVal))
        );

        // 2. Check in in-memory players array (case-insensitive roll, email, or mobile)
        let matchedPlayer = null;
        if (!user) {
          matchedPlayer = players.find(x => 
            (x.roll && x.roll.toLowerCase() === val) ||
            (x.email && x.email.toLowerCase() === val) ||
            (digitsVal.length >= 10 && ((x.phone && x.phone.replace(/\D/g, '') === digitsVal) || (x.mobile && x.mobile.replace(/\D/g, '') === digitsVal)))
          );
        }

        // 3. Fallback: Query Firestore if not found in local memory (supports 500+ users across devices)
        if (!user && !matchedPlayer && fbDb) {
          try {
            const queryTask = async () => {
              const pDocRef = fbDb.collection("players").doc(rawVal.toUpperCase());
              const pDocSnap = await pDocRef.get();
              if (pDocSnap.exists) return pDocSnap.data();

              const qSnap = await fbDb.collection("players").where("rollNumberNormalized", "==", rawVal.toUpperCase()).limit(1).get();
              if (!qSnap.empty) return qSnap.docs[0].data();

              if (digitsVal.length >= 10) {
                const mSnap = await fbDb.collection("players").where("mobile", "==", digitsVal).limit(1).get();
                if (!mSnap.empty) return mSnap.docs[0].data();
              }

              const regDoc = await fbDb.collection("registrations").doc(rawVal.toUpperCase()).get();
              if (regDoc.exists) return regDoc.data();

              return null;
            };

            // Max 1.8s timeout so player login NEVER hangs on network/Firestore latency
            const timeoutPromise = new Promise(resolve => setTimeout(() => resolve(null), 1800));
            matchedPlayer = await Promise.race([queryTask(), timeoutPromise]);

            if (matchedPlayer) {
              const rollNorm = (matchedPlayer.roll || matchedPlayer.rollNumberNormalized || rawVal).toUpperCase();
              const existingIdx = players.findIndex(p => (p.roll || '').toUpperCase() === rollNorm);
              const mapped = {
                id: matchedPlayer.id || rollNorm,
                name: matchedPlayer.name || matchedPlayer.fullName || 'Player',
                roll: rollNorm,
                email: matchedPlayer.email || `${rollNorm.toLowerCase()}@acc.edu`,
                phone: matchedPlayer.phone || matchedPlayer.mobile || '',
                bucket: matchedPlayer.bucket || 'B1',
                role: matchedPlayer.role || matchedPlayer.playerRole || 'ALL_ROUNDER',
                specialism: matchedPlayer.specialism || 'ALL_ROUNDER',
                status: matchedPlayer.status || 'APPROVED',
                isBlocked: !!matchedPlayer.isBlocked,
                price: matchedPlayer.price || 0,
                team: matchedPlayer.team || null
              };
              if (existingIdx >= 0) {
                players[existingIdx] = { ...players[existingIdx], ...mapped };
              } else {
                players.push(mapped);
              }
              saveDatabase();
            }
          } catch (err) {
            console.warn("[PlayerAuth] Cloud directory lookup note:", err);
          }
        }

        if (!user && matchedPlayer) {
          const pRoll = (matchedPlayer.roll || matchedPlayer.rollNumberNormalized || rawVal).toUpperCase();
          user = {
            uid: `usr_p${matchedPlayer.id || pRoll}`,
            username: pRoll,
            email: matchedPlayer.email || `${pRoll.toLowerCase()}@acc.edu`,
            passwordHash: matchedPlayer.password || "Player@2026",
            role: "PLAYER",
            identityType: "PLAYER",
            name: matchedPlayer.name || matchedPlayer.fullName || "Player",
            playerId: matchedPlayer.id || pRoll,
            status: matchedPlayer.isBlocked ? "BLOCKED" : (matchedPlayer.status || "ACTIVE"),
            phone: matchedPlayer.phone || matchedPlayer.mobile || ""
          };
        }

        if (!user) {
          showToast("Player roll number, mobile, or email not registered.", "error");
          return false;
        }

        if (user.status === 'BLOCKED' || user.status === 'LOCKED' || user.isBlocked) {
          showToast("Your player account is blocked. Contact Tournament Directorate.", "error");
          return false;
        }

        const expectedPlayerPass = generatePlayerInitialPassword(user.name);
        const validPlayerPasswords = [
          user.passwordHash,
          user.password,
          "Player@2026",
          "Player@ACC2026",
          expectedPlayerPass,
          (user.name || '').trim() + "@ACC2026",
          (user.name || '').replace(/[^a-zA-Z0-9]/g, '') + "@ACC2026",
          (user.name || '').split(' ')[0] + "@ACC2026"
        ].filter(Boolean);

        const isMatch = validPlayerPasswords.some(p => p && p === secret) ||
          secret === user.passwordHash ||
          secret === "Player@2026";

        if (!isMatch) {
          showToast("Invalid player password or PIN.", "error");
          return false;
        }

        currentUser = { ...user };
        localStorage.setItem("acc_current_user_2026", JSON.stringify(currentUser));
        if (window.RealtimeManager) {
          try {
            window.RealtimeManager.switchPresenceIdentity(currentUser);
          } catch (e) {
            console.warn("Presence switch note:", e);
          }
        }
        auditLog.unshift({
          time: new Date().toLocaleTimeString(),
          action: "PLAYER LOGIN",
          details: `${user.name} (${user.username}) accessed player portal.`
        });
        saveDatabase();
        showToast(`Welcome Player ${user.name}`, "success");
        switchView("player");
        return false;
      }
    }

    function toggleFranchiseLock(fId) {
      if (currentUser.role !== 'SUPER_ADMIN') return;
      const fUsers = users.filter(u => u.franchiseId === fId);
      const isCurrentlyLocked = fUsers.some(u => u.status === 'LOCKED');
      const nextStatus = isCurrentlyLocked ? 'ACTIVE' : 'LOCKED';

      fUsers.forEach(u => u.status = nextStatus);
      const f = franchises.find(item => item.id === fId);

    function openUndoModal() {
      if (currentUser.role !== 'SUPER_ADMIN') {
        showToast("ACCESS DENIED: Super Admin privilege required to execute forensic undo.", "error");
        return;
      }
      const saleEntry = auditLog.find(e => e.action === "PLAYER SOLD");
      if (!saleEntry) {
        showToast("No sales found to undo in audit trail.", "error");
        return;
      }
      let targetPlayer = players.find(p => p.status === "SOLD" && (saleEntry.details.includes(p.name) || saleEntry.details.includes(`#${p.id}`)));
      if (!targetPlayer) targetPlayer = players.slice().reverse().find(p => p.status === "SOLD");
      const leaderName = targetPlayer ? targetPlayer.soldTo : "Franchise";
      const salePrice = targetPlayer ? (targetPlayer.price || targetPlayer.basePrice) : "Current";

      const modal = document.getElementById("modalContainer");
      modal.innerHTML = `

    function executeUndoSale() {
      if (currentUser.role !== 'SUPER_ADMIN') {
        showToast("ACCESS DENIED: Super Admin privilege required to execute forensic undo.", "error");
        return;
      }
      const saleEntry = auditLog.find(e => e.action === "PLAYER SOLD");
      let targetPlayer = null;
      let leader = null;
      let refundedAmount = 0;

      if (saleEntry) {
        targetPlayer = players.find(p => p.status === "SOLD" && (saleEntry.details.includes(p.name) || saleEntry.details.includes(`#${p.id}`)));
      }
      if (!targetPlayer) {
        targetPlayer = players.slice().reverse().find(p => p.status === "SOLD");
      }

      if (!targetPlayer) {
        showToast("No active sales available to undo.", "error");
        closeModal();
        return;
      }

      leader = franchises.find(f => f.name === targetPlayer.soldTo || (saleEntry && saleEntry.details && saleEntry.details.includes(f.name)));
      refundedAmount = targetPlayer.price || targetPlayer.basePrice;

      if (leader) {
        leader.purse += refundedAmount;
        leader.squad = (leader.squad || []).filter(item => item.id !== targetPlayer.id);
      }

      targetPlayer.status = "AVAILABLE";
      targetPlayer.soldTo = null;
      targetPlayer.price = targetPlayer.basePrice;

      // Bring active lot back to this player
      lotIndex = players.findIndex(p => p.id === targetPlayer.id);
      if (lotIndex === -1) lotIndex = 0;
      currentBid = targetPlayer.basePrice;
      leadingBidderId = null;
      const sOffset = (window.RealtimeStore && window.RealtimeStore.state.connection.serverTimeOffset) || 0;
      timerSeconds = 30;
      timerDeadline = (Date.now() + sOffset) + 30000;
      timerRunning = true;
      passedFranchiseIds = [];

      auditLog.unshift({
        time: new Date().toLocaleTimeString(),
        action: "UNDO SALE",
        details: `Reverted sale of ${targetPlayer.name} (#${targetPlayer.id}) to ${leader ? leader.name : 'Team'}. Refunded ${refundedAmount}C.`,
        actorUid: currentUser.uid || 'usr_sys',
        actorRole: currentUser.role,
        identityType: currentUser.identityType || 'OPERATOR',
        playerId: targetPlayer.id,
        refundedAmount
      });

      closeModal();
      saveDatabase();
      broadcastAuthoritativeState();
      showToast(`Undo successful: ${targetPlayer.name} returned to pool, ${leader ? leader.name : 'Team'} refunded ${refundedAmount}C.`, "success");
      renderCurrentView();
    }

    // ========================================================
    // ADMIN DATA MANAGEMENT & DELETION CENTER (ACC 2026 SPEC)
    // ========================================================
    function createDataOperation(type, entityType, entityIds, snapshot, meta = {}) {
      const op = {
        operationId: "D-" + Math.floor(1000 + Math.random() * 9000),
        operationType: type,
        entityType: entityType,
        entityIds: Array.isArray(entityIds) ? entityIds : [entityIds],
        snapshot: snapshot,
        actorUid: (currentUser && currentUser.uid) || 'usr_superadmin',
        actorName: (currentUser && currentUser.name) || 'Mr. Deepak',
        actorRole: (currentUser && currentUser.role) || 'SUPER_ADMIN',
        timestamp: new Date().toISOString(),
        reversible: true,
        undoneAt: null,
        redoneAt: null,
        status: 'COMPLETED',
        ...meta
      };
      dataOperations.unshift(op);
      dataUndoStack.unshift(op.operationId);
      dataRedoStack = []; // Standard operation-history semantics: new operation clears redo stack
      saveDatabase();
      return op;
    }

    function executeUndoDataOperation(targetOpId = null) {
      const opId = targetOpId || dataUndoStack[0];
      if (!opId) {
        showToast("No operation available to undo.", "info");
        return;
      }
      const op = dataOperations.find(o => o.operationId === opId);
      if (!op) {
        showToast(`Operation ${opId} not found.`, "error");
        return;
      }
      if (op.status === 'UNDONE') {
        showToast(`Operation ${opId} has already been undone.`, "error");
        return;
      }

      // Conflict Check: verify no active record already occupies the roll or franchise name/number
      if (op.entityType === 'PLAYER' || op.entityType === 'ALL') {
        const pSnaps = (op.entityType === 'ALL' ? (op.snapshot.players || []) : op.snapshot) || [];
        for (const snap of pSnaps) {
          const snapRoll = (snap.roll || snap.rollNumberNormalized || '').trim().toUpperCase();
          const conflict = players.find(p => String(p.id) !== String(snap.id) && (p.roll || p.rollNumberNormalized || '').trim().toUpperCase() === snapRoll);
          if (conflict) {
            showToast(`RESTORE CONFLICT: Active player "${conflict.name}" (${snapRoll}) already exists!`, "error");
            return;
          }
        }
      }
      if (op.entityType === 'FRANCHISE' || op.entityType === 'ALL') {
        const fSnaps = (op.entityType === 'ALL' ? (op.snapshot.franchises || []) : op.snapshot) || [];
        for (const snap of fSnaps) {
          const snapName = (snap.name || '').trim().toLowerCase();
          const snapNum = parseInt(snap.id || snap.teamNumber || '0', 10);
          const conflict = franchises.find(f => String(f.id) !== String(snap.id) && ((f.name || '').trim().toLowerCase() === snapName || parseInt(f.id, 10) === snapNum));
          if (conflict) {
            showToast(`RESTORE CONFLICT: Active franchise "${conflict.name}" (#${conflict.id}) already exists!`, "error");
            return;
          }
        }
      }

      // Restore Players
      if (op.entityType === 'PLAYER' || op.entityType === 'ALL') {
        const pSnaps = (op.entityType === 'ALL' ? (op.snapshot.players || []) : op.snapshot) || [];
        pSnaps.forEach(snap => {
          const dIdx = deletedPlayers.findIndex(d => String(d.id) === String(snap.id) || ((d.roll || '').toUpperCase() === (snap.roll || '').toUpperCase()));
          if (dIdx >= 0) deletedPlayers.splice(dIdx, 1);
          const pIdx = players.findIndex(p => String(p.id) === String(snap.id) || ((p.roll || '').toUpperCase() === (snap.roll || '').toUpperCase()));
          if (pIdx >= 0) players[pIdx] = { ...snap };
          else players.push({ ...snap });
          syncPlayerToFirebase(snap, 'UPDATE');
        });
      }

      // Restore Franchises
      if (op.entityType === 'FRANCHISE' || op.entityType === 'ALL') {
        const fSnaps = (op.entityType === 'ALL' ? (op.snapshot.franchises || []) : op.snapshot) || [];
        fSnaps.forEach(snap => {
          const dIdx = deletedFranchises.findIndex(d => String(d.id) === String(snap.id));
          if (dIdx >= 0) deletedFranchises.splice(dIdx, 1);
          const fIdx = franchises.findIndex(f => String(f.id) === String(snap.id));
          if (fIdx >= 0) franchises[fIdx] = { ...snap };
          else franchises.push({ ...snap });
        });
      }

      op.status = 'UNDONE';
      op.undoneAt = new Date().toISOString();

      const uIdx = dataUndoStack.indexOf(opId);
      if (uIdx >= 0) dataUndoStack.splice(uIdx, 1);
      if (!dataRedoStack.includes(opId)) dataRedoStack.unshift(opId);

      auditLog.unshift({
        time: new Date().toLocaleTimeString(),
        action: "DATA_OPERATION_UNDONE",
        actorUid: (currentUser && currentUser.uid) || 'usr_superadmin',
        role: (currentUser && currentUser.role) || 'SUPER_ADMIN',
        targetId: op.operationId,
        timestamp: new Date().toISOString(),
        details: `Operation ${op.operationId} undone by ${(currentUser && currentUser.name) || 'Admin'}. ${op.entityIds.length} records restored.`
      });

      saveDatabase();
      broadcastAuthoritativeState();
      showToast(`Restored successfully (${op.entityIds.length} records).`, "success", "REDO", () => executeRedoDataOperation(op.operationId), 6000);
      renderCurrentView();
    }

    function executeRedoDataOperation(targetOpId = null) {
      const opId = targetOpId || dataRedoStack[0];
      if (!opId) {
        showToast("No operation available to redo.", "info");
        return;
      }
      const op = dataOperations.find(o => o.operationId === opId);
      if (!op) {
        showToast(`Operation ${opId} not found.`, "error");
        return;
      }
      if (op.status !== 'UNDONE') {
        showToast(`Operation ${opId} cannot be redone (Status: ${op.status}).`, "error");
        return;
      }

      // Re-apply Deletion
      if (op.entityType === 'PLAYER' || op.entityType === 'ALL') {
        const pSnaps = (op.entityType === 'ALL' ? (op.snapshot.players || []) : op.snapshot) || [];
        pSnaps.forEach(snap => {
          const pIdx = players.findIndex(p => String(p.id) === String(snap.id) || ((p.roll || '').toUpperCase() === (snap.roll || '').toUpperCase()));
          if (pIdx >= 0) {
            const p = players.splice(pIdx, 1)[0];
            p.status = 'DELETED';
            p.approvalStatus = 'DELETED';
            p.verificationStatus = 'DELETED';
            p.publicVisibility = false;
            p.deleted = true;
            p.trashedAt = new Date().toISOString();
            p.trashedBy = (currentUser && currentUser.name) || 'Mr. Deepak';
            p.operationId = op.operationId;
            if (!deletedPlayers.some(d => String(d.id) === String(p.id))) {
              deletedPlayers.push(p);
            }
            syncPlayerToFirebase(p, 'DELETE');
          }
        });
      }

      if (op.entityType === 'FRANCHISE' || op.entityType === 'ALL') {
        const fSnaps = (op.entityType === 'ALL' ? (op.snapshot.franchises || []) : op.snapshot) || [];
        fSnaps.forEach(snap => {
          const fIdx = franchises.findIndex(f => String(f.id) === String(snap.id));
          if (fIdx >= 0) {
            const f = franchises.splice(fIdx, 1)[0];
            f.status = 'TRASHED';
            f.deleted = true;
            f.trashedAt = new Date().toISOString();
            f.trashedBy = (currentUser && currentUser.name) || 'Mr. Deepak';
            f.operationId = op.operationId;
            if (!deletedFranchises.some(d => String(d.id) === String(f.id))) {
              deletedFranchises.push(f);
            }
          }
        });
      }

      op.status = 'REDONE';
      op.redoneAt = new Date().toISOString();

      const rIdx = dataRedoStack.indexOf(opId);
      if (rIdx >= 0) dataRedoStack.splice(rIdx, 1);
      if (!dataUndoStack.includes(opId)) dataUndoStack.unshift(opId);

      auditLog.unshift({
        time: new Date().toLocaleTimeString(),
        action: "DATA_OPERATION_REDONE",
        actorUid: (currentUser && currentUser.uid) || 'usr_superadmin',
        role: (currentUser && currentUser.role) || 'SUPER_ADMIN',
        targetId: op.operationId,
        timestamp: new Date().toISOString(),
        details: `Operation ${op.operationId} redone by ${(currentUser && currentUser.name) || 'Admin'}.`
      });

      saveDatabase();
      broadcastAuthoritativeState();
      showToast(`Operation ${op.operationId} redone. Records moved to Trash.`, "info", "UNDO", () => executeUndoDataOperation(op.operationId), 6000);
      renderCurrentView();
    }

    function executePermanentDelete(entityType, id) {
      const isPlayer = entityType === 'PLAYER';
      if (isPlayer) {
        const idx = deletedPlayers.findIndex(d => String(d.id) === String(id));
        if (idx >= 0) {
          const p = deletedPlayers.splice(idx, 1)[0];
          auditLog.unshift({
            time: new Date().toLocaleTimeString(),
            action: "PLAYER_PERMANENTLY_DELETED",
            actorUid: (currentUser && currentUser.uid) || 'usr_superadmin',
            role: (currentUser && currentUser.role) || 'SUPER_ADMIN',
            targetId: p.roll || String(p.id),
            timestamp: new Date().toISOString(),
            details: `Player ${p.name} (${p.roll}) permanently purged from Trash by ${(currentUser && currentUser.name) || 'Admin'}.`
          });
        }
      } else {
        const idx = deletedFranchises.findIndex(d => String(d.id) === String(id));
        if (idx >= 0) {
          const f = deletedFranchises.splice(idx, 1)[0];
          auditLog.unshift({
            time: new Date().toLocaleTimeString(),
            action: "FRANCHISE_PERMANENTLY_DELETED",
            actorUid: (currentUser && currentUser.uid) || 'usr_superadmin',
            role: (currentUser && currentUser.role) || 'SUPER_ADMIN',
            targetId: String(f.id),
            timestamp: new Date().toISOString(),
            details: `Franchise ${f.name} (#${f.id}) permanently purged from Trash by ${(currentUser && currentUser.name) || 'Admin'}.`
          });
        }
      }
      saveDatabase();
      broadcastAuthoritativeState();
      closeModal();
      showToast("Record permanently deleted.", "info");
      renderCurrentView();
    }

    function executeRestoreFromTrash(entityType, id) {
      const isPlayer = entityType === 'PLAYER';
      if (isPlayer) {
        const dIdx = deletedPlayers.findIndex(d => String(d.id) === String(id));
        if (dIdx === -1) return;
        const p = deletedPlayers[dIdx];
        const rollNorm = (p.roll || '').trim().toUpperCase();

        const conflict = players.find(x => String(x.id) !== String(p.id) && (x.roll || '').trim().toUpperCase() === rollNorm);
        if (conflict) {
          showToast(`RESTORE CONFLICT: Active player "${conflict.name}" already uses roll ${rollNorm}.`, "error");
          return;
        }

        deletedPlayers.splice(dIdx, 1);
        p.status = 'AVAILABLE';
        p.approvalStatus = 'APPROVED';
        p.verificationStatus = 'VERIFIED';
        p.publicVisibility = true;
        delete p.deleted;
        delete p.deletedAt;
        delete p.deletedBy;
        delete p.trashedAt;
        delete p.trashedBy;
        delete p.operationId;
        players.push(p);

        auditLog.unshift({
          time: new Date().toLocaleTimeString(),
          action: "PLAYER_RESTORED",
          actorUid: (currentUser && currentUser.uid) || 'usr_superadmin',
          role: (currentUser && currentUser.role) || 'SUPER_ADMIN',
          targetId: p.roll || String(p.id),
          timestamp: new Date().toISOString(),
          details: `Player ${p.name} (${p.roll}) restored from Trash by ${(currentUser && currentUser.name) || 'Admin'}.`
        });
        syncPlayerToFirebase(p, 'UPDATE');
      } else {
        const dIdx = deletedFranchises.findIndex(d => String(d.id) === String(id));
        if (dIdx === -1) return;
        const f = deletedFranchises[dIdx];
        const nameNorm = (f.name || '').trim().toLowerCase();

        const conflict = franchises.find(x => String(x.id) !== String(f.id) && (x.name || '').trim().toLowerCase() === nameNorm);
        if (conflict) {
          showToast(`RESTORE CONFLICT: Active franchise "${conflict.name}" already exists.`, "error");
          return;
        }

        deletedFranchises.splice(dIdx, 1);
        f.status = 'ACTIVE';
        f.approvalStatus = 'APPROVED';
        delete f.deleted;
        delete f.trashedAt;
        delete f.trashedBy;
        delete f.operationId;
        franchises.push(f);

        auditLog.unshift({
          time: new Date().toLocaleTimeString(),
          action: "FRANCHISE_RESTORED",
          actorUid: (currentUser && currentUser.uid) || 'usr_superadmin',
          role: (currentUser && currentUser.role) || 'SUPER_ADMIN',
          targetId: String(f.id),
          timestamp: new Date().toISOString(),
          details: `Franchise ${f.name} (#${f.id}) restored from Trash by ${(currentUser && currentUser.name) || 'Admin'}.`
        });
      }

      saveDatabase();
      broadcastAuthoritativeState();
      showToast("Record restored to active dataset.", "success");
      renderCurrentView();
    }

    function downloadBackupFile(type) {
      let exportData = {};
      let filename = `ACC_2026_BACKUP_${type}_${Date.now()}.json`;

      if (type === 'PLAYERS') {
        exportData = { exportType: 'PLAYERS', timestamp: new Date().toISOString(), activePlayers: players, trashedPlayers: deletedPlayers };
      } else if (type === 'FRANCHISES') {
        exportData = { exportType: 'FRANCHISES', timestamp: new Date().toISOString(), activeFranchises: franchises, trashedFranchises: deletedFranchises };
      } else {
        exportData = {
          exportType: 'FULL_SNAPSHOT',
          timestamp: new Date().toISOString(),
          players,
          deletedPlayers,
          franchises,
          deletedFranchises,
          dataOperations,
          auditLog
        };
      }

      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`Backup exported: ${filename}`, "success");
    }

        if (playerApprovalFilter === 'DELETED' && !isDel) return false;

        if (typeof playerYearFilter !== 'undefined' && playerYearFilter !== 'ALL' && String(p.year) !== String(playerYearFilter)) return false;
        if (typeof playerProgramFilter !== 'undefined' && playerProgramFilter !== 'ALL' && p.program !== playerProgramFilter) return false;
        if (playerAuctionStatusFilter !== 'ALL' && p.status !== playerAuctionStatusFilter) return false;

          if (playerAccountFilter === 'ACTIVE' && acc !== 'ACTIVE') return false;

    function switchView(viewName) {
      if (viewName === "register" && !window.isEditingRegistration) {
        initFreshRegistrationState();
      }

      const authCtx = getCurrentUserContext();

      // STRICT ROLE-AWARE ROUTE GUARDS (SECTIONS 4, 6, 7, 58, 70)
      if (viewName === "admin") {
        if (!authCtx.isAdmin) {
          showToast("ACCESS DENIED: Operational console requires verified Admin authorization.", "error");
          viewName = "public";
          window.location.hash = "home";
        }
      } else if (viewName === "franchise") {
        if (!authCtx.isFranchise && !authCtx.isSuperAdmin) {
          showToast("ACCESS DENIED: Franchise terminal requires verified Franchise authorization.", "error");
          viewName = "public";
          window.location.hash = "home";
        }
      } else if (viewName === "player") {
        if (!authCtx.isPlayer) {
          showToast("ACCESS DENIED: Personal portal requires verified Player authorization.", "error");
          viewName = authCtx.isAdmin ? "admin" : "public";
          window.location.hash = authCtx.isAdmin ? "admin" : "home";
        }
      }

      // FIRST LOGIN: MANDATORY PASSWORD CHANGE GUARD (SECTIONS 33, 35, 66)
      if (authCtx.authenticated && authCtx.mustChangePassword && (viewName === 'admin' || viewName === 'franchise' || viewName === 'player')) {
        showToast("SECURITY MANDATE: Please update your initial password before accessing your workspace.", "warning");
        openPasswordChangeModal(currentUser);
        return;
      }

      // Show brief speeder loading animation on page navigation
      const info = getPageViewLoadingInfo(viewName);
      showSpeederOverlay(info.title, info.sub);

      currentView = viewName;
      if (window.location.hash !== "#" + viewName && !(viewName === "public" && window.location.hash === "#home")) {
        window.location.hash = viewName === "public" ? "home" : viewName;
      }
      if (viewName === "projector") {
        document.body.classList.add("projector-active");
      } else {
        document.body.classList.remove("projector-active");
      }

      try {
        renderHeaderNav();
        renderCurrentView();
      } catch (err) {
        console.error("[switchView] Error rendering view:", err);
      } finally {
        hideSpeederOverlay(250);
      }
    }

    let speederOverlayTimer = null;

    function showSpeederOverlay(title = "LOADING ACC 2026 OS...", sub = "Synchronizing Authoritative Cloud State") {
      const el = document.getElementById("speederOverlay");
      if (el) {
        const t = document.getElementById("speederMsg");
        const s = document.getElementById("speederSub");
        if (t) t.textContent = title;
        if (s) s.textContent = sub;
        el.classList.remove("hidden");
        el.style.display = "flex";
        el.style.opacity = "1";
        el.style.visibility = "visible";

        // FAILSAFE: Automatically dismiss after 2.5s max to guarantee no infinite loading loop
        if (speederSafetyTimer) clearTimeout(speederSafetyTimer);
        speederSafetyTimer = setTimeout(() => {
          hideSpeederOverlay(0);
        }, 2500);
      }
    }

    function hideSpeederOverlay(delay = 0) {
      if (speederOverlayTimer) clearTimeout(speederOverlayTimer);
      if (speederFadeTimer) clearTimeout(speederFadeTimer);
      if (speederSafetyTimer) clearTimeout(speederSafetyTimer);
      speederOverlayTimer = setTimeout(() => {
        const el = document.getElementById("speederOverlay");
        if (el) {
          el.style.opacity = "0";
          speederFadeTimer = setTimeout(() => {
            el.classList.add("hidden");
            el.style.display = "none";
            el.style.visibility = "hidden";
          }, 200);
        }
      }, delay);
    }

    function showLoadingOverlay(title = "LOADING ACC 2026 OS...", sub = "Synchronizing Authoritative Cloud State") {
      showSpeederOverlay(title, sub);
    }

    function hideLoadingOverlay() {
      const elapsed = Date.now() - portalLoadStartTime;

    function getTeamOnlineCount(franchiseId) {
      if (!franchiseId) return 1;
      const presenceDetails = (window.RealtimeStore && window.RealtimeStore.state.presence.details) || {};
      let count = 0;
      for (const [uKey, conns] of Object.entries(presenceDetails)) {
        if (!conns || typeof conns !== 'object') continue;
        const entries = Object.values(conns);
        if (entries.some(c => c && c.franchiseId == franchiseId)) {
          count++;
        }
      }
      return Math.max(1, count);
    }

            lastHeartbeat: firebase.database.ServerValue.TIMESTAMP
          };
          return myPresenceRef.set(sessionPayload);
        }).then(() => {
          RealtimeStore.state.presence.status = "ONLINE";
        }).catch(err => {
          console.warn("[RTDB] Presence registration note:", err);
        });
      },

      subscribePresenceSystem() {
        if (!fbRtdb) return;

        // Cleanup existing listeners
        if (this.unsubPresence) {
          console.log("[RTDB] presence listener removed");
          this.unsubPresence.off();
          this.unsubPresence = null;
        }
        if (this.unsubPublicStats) {
          this.unsubPublicStats.off();
          this.unsubPublicStats = null;
        }

        const isAdmin = currentUser.role === "SUPER_ADMIN" || currentUser.role === "ADMIN";

        if (isAdmin) {
          // ADMIN MONITOR: Listens to /presence for deep telemetry (Section 50)
          console.log("[RTDB] presence listener attached");
          const presenceRef = fbRtdb.ref("presence");
          this.unsubPresence = presenceRef;
          presenceRef.on("value", (snapshot) => {
            const val = snapshot.val() || {};
            RealtimeStore.state.presence.details = val;
            let totalConns = 0;
            const uniqueKeys = new Set();
            const franchiseSet = new Set();
            let teamLeads = 0;
            let playersCount = 0;
            let pubViewers = 0;

            for (const [uKey, conns] of Object.entries(val)) {
              if (!conns || typeof conns !== 'object') continue;
              const entries = Object.values(conns);
              if (entries.length > 0) {
                uniqueKeys.add(uKey);
                totalConns += entries.length;
                const sample = entries[0];
                if (uKey.startsWith("pub_") || sample.type === "PUBLIC") {
                  pubViewers++;
                } else {
                  if (sample.franchiseId) {
                    franchiseSet.add(String(sample.franchiseId));
                  }
                  if (sample.identityType === "TEAM_LEADER" || sample.identityType === "CAPTAIN") {
                    teamLeads++;
                  }
                  if (sample.role === "PLAYER") {
                    playersCount++;
                  }
                }
              }
            }

            const calculatedUsers = Math.max(1, uniqueKeys.size);
            RealtimeStore.state.presence.liveUsers = calculatedUsers;
            RealtimeStore.state.presence.liveConnections = Math.max(1, totalConns);
            RealtimeStore.state.presence.activeFranchises = franchiseSet.size;
            RealtimeStore.state.presence.activeTeamLeads = teamLeads;
            RealtimeStore.state.presence.activePlayers = playersCount;
            RealtimeStore.state.presence.publicViewers = pubViewers;

            updateLiveUsersCount(calculatedUsers);

            // Synchronize authoritative safe aggregate for public viewers (Section 22 & 23)
            fbRtdb.ref("publicStats/liveUsers").set({
              count: calculatedUsers,
              connectionsCount: Math.max(1, totalConns),
              activeFranchisesCount: franchiseSet.size,
              activeTeamLeadsCount: teamLeads,
              activePlayersCount: playersCount,
              publicViewersCount: pubViewers,
              updatedAt: firebase.database.ServerValue.TIMESTAMP
            }).catch(() => {});
          });
        } else {
          // PUBLIC / FRANCHISE / PLAYER: Reads ONLY safe aggregate /publicStats/liveUsers (Section 22 & 51)
          console.log("[RTDB] presence listener attached");
          const publicStatsRef = fbRtdb.ref("publicStats/liveUsers");
          this.unsubPublicStats = publicStatsRef;
          publicStatsRef.on("value", (snap) => {
            const data = snap.val();
            if (data && typeof data.count === "number") {
              if (data.activeFranchisesCount !== undefined) {
                RealtimeStore.state.presence.activeFranchises = data.activeFranchisesCount;
              }
              updateLiveUsersCount(data.count);
            } else {
              updateLiveUsersCount(1);
            }
          });
        }
      },

      switchPresenceIdentity(newUser) {
        if (myPresenceRef) {
          myPresenceRef.remove().catch(() => {});
        }
        this.registerPresenceRecord();
        this.subscribePresenceSystem();
        this.subscribeCurrentUser();
      }
    };

    function applyAuthoritativeAuctionState(data, broadcast = false) {
      if (!data) return;

      if (data.auctionState) {
        auctionState = data.auctionState;
        if (auctionState === 'PAUSED') {
          auctionPaused = true;
          timerRunning = false;
          if (timerInterval) clearInterval(timerInterval);
        } else if (auctionState === 'RUNNING') {
          auctionPaused = false;
        }
      }

      lotIndex = typeof data.lotIndex === "number" ? data.lotIndex : lotIndex;
      currentBid = typeof data.currentBid === "number" ? data.currentBid : currentBid;
      leadingBidderId = data.leadingBidderId !== undefined ? data.leadingBidderId : leadingBidderId;
      auctionPaused = !!data.auctionPaused;
      passedFranchiseIds = Array.isArray(data.passedFranchiseIds) ? data.passedFranchiseIds : passedFranchiseIds;

      const sOffset = (window.RealtimeStore && window.RealtimeStore.state.connection.serverTimeOffset) || 0;
      const serverNow = Date.now() + sOffset;

      // Server-authoritative timer deadline calculation (Section 35)
      if (data.timerDeadline) {
        timerDeadline = data.timerDeadline;
        if (data.timerRunning && !data.auctionPaused) {
          const remaining = Math.max(0, Math.ceil((timerDeadline - serverNow) / 1000));
          timerSeconds = remaining;
          if (remaining <= 0) {
            timerRunning = false;
          } else {
            timerRunning = true;
            startTimer();
          }
        } else {
          timerSeconds = typeof data.timerSeconds === "number" ? data.timerSeconds : 0;
          timerRunning = false;
        }
      }

      if (Array.isArray(data.franchises) && data.franchises.length > 0) {
        franchises = data.franchises;
      }
      if (Array.isArray(data.deletedPlayers)) {
        const dMap = new Map();
        deletedPlayers.forEach(d => {
          const k = (d.roll || d.rollNumberNormalized || d.id || '').toString().toUpperCase();
          if (k) dMap.set(k, d);
        });
        data.deletedPlayers.forEach(d => {
          const k = (d.roll || d.rollNumberNormalized || d.id || '').toString().toUpperCase();
          if (k) dMap.set(k, d);
        });
        deletedPlayers = Array.from(dMap.values());
      }
      if (Array.isArray(data.players)) {
        const dSet = new Set(deletedPlayers.map(d => (d.roll || d.rollNumberNormalized || d.id || '').toString().toUpperCase()));
        players = data.players.filter(p => {
          const key = (p.roll || p.rollNumberNormalized || p.id || '').toString().toUpperCase();
          return !dSet.has(key) && p.status !== 'DELETED';
        });
      }
      if (Array.isArray(data.auditLog) && data.auditLog.length > 0) {
        auditLog = data.auditLog;
      }
      if (Array.isArray(data.deletedFranchises)) {
        deletedFranchises = data.deletedFranchises;
      }
      if (Array.isArray(data.dataOperations)) {
        dataOperations = data.dataOperations;
      }

      if (window.RealtimeStore) {
        window.RealtimeStore.state.auction = {
          lotIndex,
          currentBid,
          leadingBidderId,
          timerSeconds,
          timerDeadline,
          timerRunning,
          auctionPaused,
          passedFranchiseIds,
          lotVersion: data.lotVersion || 1
        };
        window.RealtimeStore.state.currentLot = players[lotIndex] || null;
        window.RealtimeStore.state.players = players;
        window.RealtimeStore.state.franchise = franchises;
      }

      renderConnectionBadge("LIVE");
      if (typeof updateTimerDisplay === 'function') updateTimerDisplay();
      renderHeaderNav();
      renderCurrentView();
    }

            dotAngles.forEach((angle) => {
              const dot = document.createElement("div");
              dot.style.cssText = `position: absolute; left: ${x - strokeWidth / 2}px; top: ${y - strokeWidth / 2}px; width: ${strokeWidth}px; height: ${strokeWidth}px; background-color: ${color}; pointer-events: none; border-radius: 50%; transform-origin: center; transform: rotate(${rotation}deg);`;
              container.appendChild(dot);

              const targetX = Math.cos(angle) * (effectSize * 0.4);
              const targetY = Math.sin(angle) * (effectSize * 0.4);

              if (typeof gsap !== "undefined") {
                gsap.set(dot, { x: 0, y: 0, width: strokeWidth, height: strokeWidth });
                gsap.timeline()
                  .to(dot, {
                    x: targetX,
                    y: targetY,
                    duration: duration,
                    ease: "power2.out",
                    onComplete: () => { if (dot.parentNode) dot.parentNode.removeChild(dot); }
                  })
                  .to(dot, { width: 0, height: 0, duration: duration * 0.4, ease: "linear" }, duration * 0.6);
              } else {
                if (dot.animate) {
                  dot.animate([
                    { transform: "translate(0, 0) scale(1)", opacity: 1 },
                    { transform: `translate(${targetX}px, ${targetY}px) scale(0)`, opacity: 0 }
                  ], { duration: duration * 1000, easing: "ease-out" });
                }
                setTimeout(() => { if (dot.parentNode) dot.parentNode.removeChild(dot); }, duration * 1000);
              }
            });
          } else if (interactionMode === "rings") {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.style.cssText = svgStyle;
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", effectSize / 2);
            circle.setAttribute("cy", effectSize / 2);
            circle.setAttribute("r", effectSize / 4);
            circle.setAttribute("fill", "none");
            circle.setAttribute("stroke", color);
            circle.setAttribute("stroke-width", strokeWidth);
            svg.appendChild(circle);
            container.appendChild(svg);

            if (typeof gsap !== "undefined") {
              gsap.set(svg, { scale: 0.5 });
              gsap.timeline()
                .to(svg, {
                  scale: 2,
                  duration: duration,
                  ease: "power3.out",
                  onComplete: () => { if (svg.parentNode) svg.parentNode.removeChild(svg); }
                }, 0)
                .to(svg, { opacity: 0, duration: duration * 0.2, ease: "linear" }, duration * 0.8);
            } else {
              if (svg.animate) {
                svg.animate([
                  { transform: "scale(0.5)", opacity: 1 },
                  { transform: "scale(2)", opacity: 0 }
                ], { duration: duration * 1000, easing: "ease-out" });
              }
              setTimeout(() => { if (svg.parentNode) svg.parentNode.removeChild(svg); }, duration * 1000);
            }
          } else if (interactionMode === "burst" || interactionMode === "crosshair" || interactionMode === "particles") {
            // General multi-particle burst
            for (let i = 0; i < 8; i++) {
              const dot = document.createElement("div");
              dot.style.cssText = `position: absolute; left: ${x - strokeWidth / 2}px; top: ${y - strokeWidth / 2}px; width: ${strokeWidth * 2}px; height: ${strokeWidth * 2}px; background-color: ${color}; pointer-events: none; border-radius: 50%;`;
              container.appendChild(dot);
              const ang = i * 45 * (Math.PI / 180);
              const dist = effectSize * 0.25 + Math.random() * (effectSize * 0.25);
              const destX = Math.cos(ang) * dist;
              const destY = Math.sin(ang) * dist;

              if (typeof gsap !== "undefined") {
                gsap.to(dot, {
                  x: destX,
                  y: destY,
                  opacity: 0,
                  duration: duration,
                  ease: "power1.out",
                  onComplete: () => { if (dot.parentNode) dot.parentNode.removeChild(dot); }
                });
              } else {
                if (dot.animate) {
                  dot.animate([
                    { transform: "translate(0, 0)", opacity: 1 },
                    { transform: `translate(${destX}px, ${destY}px)`, opacity: 0 }
                  ], { duration: duration * 1000, easing: "ease-out" });
                }
                setTimeout(() => { if (dot.parentNode) dot.parentNode.removeChild(dot); }, duration * 1000);
              }
            }
          }
        });
      }
    })();


    window.addEventListener("online", () => {
      console.log("[Network] Browser went online");
      if (fbRtdb) {
        try { fbRtdb.goOnline(); } catch(e) {}
      }
      if (window.RealtimeStore && window.RealtimeStore.state.connection.status === "CONNECTED") {
        renderConnectionBadge("LIVE");
      }
    });

    window.addEventListener("offline", () => {
      console.log("[Network] Browser went offline");
      if (window.RealtimeStore) {
        window.RealtimeStore.state.connection.status = "OFFLINE";
      }
      renderConnectionBadge("OFFLINE");
    });

    window.addEventListener("hashchange", () => {
      let rawHash = window.location.hash.replace(/^#\/?/, "");
      let hash = rawHash.split('/')[0] || "public";
      if (hash === "home" || !hash) hash = "public";
      if (hash && currentView !== hash) {
        switchView(hash);
      }
    });
  </script>
</body>
